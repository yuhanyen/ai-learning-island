/* =====================================================================

/* ── 按鈕：最小 44px、圓角 9px、hover 黃底、按下 ink 底、focus 珊瑚框 ── */
.btn{min-height:44px;min-width:44px;border-radius:9px;border:1px solid #eadfd3;background:#fffaf6;color:var(--ink);

<script type="module">
/* =====================================================================
 * 0. 啟動流程與錯誤處理
 *    WebGL 或 CDN 失敗時，在載入畫面顯示白話訊息，不留白畫面。
 * ===================================================================== */
let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, BGU, SimplexNoise;
const $ = s => document.querySelector(s);
let booted = false;

function showError(msg, detail){
  const ld = $('#loader');
  ld.classList.remove('done'); ld.classList.add('error');
  $('#loader-msg').textContent = msg;
  $('#ld-retry').hidden = false;
  if (detail) console.error(detail);
}
window.addEventListener('error', e => { if (!booted) showError('畫面載入時出了點問題，請重新整理再試一次。', e.error || e.message); });
window.addEventListener('unhandledrejection', e => { if (!booted) showError('畫面載入時出了點問題，請重新整理再試一次。', e.reason); });

/* localStorage 讀寫一律包 try/catch（無痕模式或封鎖時不會壞） */
const store = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 忽略 */ } },
};

function hasWebGL(){
  try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch { return false; }
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('載入逾時')), ms))]);

boot();

async function boot(){
  if (typeof DATA === 'undefined' || !DATA || !DATA.maps) { showError('資料讀取失敗，請確認檔案完整後重新整理。'); return; }
  document.title = DATA.meta.title; $('#ld-title').textContent = DATA.meta.title; $('#title').textContent = DATA.meta.title;
  if (!hasWebGL()) { showError('這台裝置無法顯示 3D 畫面，請改用電腦版 Chrome 開啟。'); return; }
  try {
    const m = await withTimeout(Promise.all([
      import('three'),
      import('three/addons/controls/OrbitControls.js'),
      import('three/addons/renderers/CSS2DRenderer.js'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('three/addons/utils/BufferGeometryUtils.js'),
      import('three/addons/math/SimplexNoise.js'),
    ]), 25000);
    THREE = m[0]; ({ OrbitControls } = m[1]); ({ CSS2DRenderer, CSS2DObject } = m[2]);
    ({ RoundedBoxGeometry } = m[3]); BGU = m[4]; ({ SimplexNoise } = m[5]);
  } catch (err) { showError('3D 元件下載失敗，請確認網路連線後重新整理。', err); return; }
  try { start(); }
  catch (err) { showError('這台裝置無法顯示 3D 畫面，請改用電腦版 Chrome 開啟。', err); }
}

/* =====================================================================
 * 1. 常數與小工具
 * ===================================================================== */
const R = 2.02, SPACING = 2.28, TOP = 0.65, WATER_Y = -0.18;
const SQ3 = Math.sqrt(3), HEX_IN = SQ3 / 2;            // 內切半徑 = 外接半徑 × √3/2
const WALK_R = 1.8, WALK_W = 0.28, WALK_Y = TOP + 0.006;
const BODY_BOTTOM = -0.62;
const PAL = {
  coral:'#db6a41', ink:'#211d1d', cream:'#fff8f4', yellow:'#fcea8b', stone:'#c5b5a7', green:'#71806a',
  glass:'#86a8a6', wood:'#b48560', teal:'#3e7c8c', plant:['#9cc27a','#8db86f','#728f5f'],
  accent:['#f2b5c6','#58a6a6','#6f7fb5'], wall:'#f4ebdd', eave:'#a34e34', window:'#a8c4c2',
  curb:'#e4d6c3', walk:'#ebc2a3', cliff:'#e6c9a6',
};

/* 固定種子亂數：每次載入場景都一樣 */
function mulberry32(a){
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hashStr = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; };
const rngFor = name => mulberry32(hashStr(name));

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;      // easeInOutCubic
const easeOutBack = t => { const c = 1.70158, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hexDist = (x, z) => { x = Math.abs(x); z = Math.abs(z); return Math.max(x, x * .5 + z * HEX_IN); }; // pointy-top 六角距離
const axial = (q, r) => ({ x: SQ3 * SPACING * (q + r / 2), z: 1.5 * SPACING * r });
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fmtTime = m => { m = ((Math.floor(m / 10) * 10) % 1440 + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const mobileMQ = matchMedia('(max-width: 800px), (max-height: 500px)');          // 手機（含橫拿）：底部面板版型
const landMQ = matchMedia('(max-height: 500px) and (orientation: landscape)');   // 手機橫拿：面板改成左右側欄
let reduced = reduceMQ.matches;
const QS = new URLSearchParams(location.search);

/* 全域狀態 */
const state = { mapId: null, map: null, view: 'overview', hudStep: -1, segId: undefined };
const clock = { min: 600, running: true };       // 從 10:00 開始，每秒走 10 分鐘
let dirty = true, last = 0, worldTime = 0;

/* =====================================================================
 * 2. 渲染器、相機、控制器
 * ===================================================================== */
let renderer, labelRenderer, scene, camera, controls, glEl;
const CITY = { x: 0, z: 0, v: null };            // 城市中心（start 時計算）

function initRenderer(){
  glEl = $('#gl');
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, mobileMQ.matches ? 1.4 : 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  glEl.appendChild(renderer.domElement);

  labelRenderer = new CSS2DRenderer();
  labelRenderer.domElement.className = 'labels';
  glEl.appendChild(labelRenderer.domElement);

  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = 3;
  controls.maxDistance = 70;
  controls.addEventListener('change', () => { dirty = true; });
  controls.addEventListener('start', () => { state.view = 'free'; });

}

/* ── 全景視角：橫式方向固定、距離依長寬比；直式改用較高的俯角，距離算到島群剛好塞滿寬度 ── */
let OV_DIR;
const OV_TALL_POLAR = 48 * Math.PI / 180;
function overviewDist(){
  const a = glEl.clientWidth / Math.max(1, glEl.clientHeight);
  return a >= 1.25 ? 28.5 : 38;
}
/* 二分法找相機距離：讓 pts 投影後都落在畫面 |x| ≤ mx、|y| ≤ my（NDC）之內 */
function fitDist(center, dir, pts, mx, my){
  const cam = camera.clone(), v = new THREE.Vector3();
  let lo = 6, hi = 160;
  for (let n = 0; n < 16; n++){
    const d = (lo + hi) / 2;
    cam.position.copy(center).addScaledVector(dir, d); cam.lookAt(center); cam.updateMatrixWorld();
    if (pts.every(p => { v.copy(p).project(cam); return Math.abs(v.x) <= mx && Math.abs(v.y) <= my; })) hi = d; else lo = d;
  }
  return hi;
}
function hexCorners(list){                                         // 島面六個角（取景用）
  const pts = [];
  for (const W of list) for (let k = 0; k < 6; k++){ const a = (30 + 60 * k) * Math.PI / 180; pts.push(new THREE.Vector3(W.x + R * Math.cos(a), TOP, W.z + R * Math.sin(a))); }
  return pts;
}
function tallOverviewOffset(){
  const h = Math.hypot(OV_DIR.x, OV_DIR.z), s = Math.sin(OV_TALL_POLAR);
  const dir = new THREE.Vector3(OV_DIR.x / h * s, Math.cos(OV_TALL_POLAR), OV_DIR.z / h * s);
  return dir.multiplyScalar(fitDist(CITY.v, dir, hexCorners(ISL), 0.86, 0.76));   // 左右各留 7%，島名標籤才不會出界
}
const isMobile = () => mobileMQ.matches;
const fitScale = () => { const a = camera.aspect || 1; return a >= 1 ? 1 : clamp(0.75 / a, 1, 1.8); };   // 直式螢幕拉遠，整座島才放得下
const ISL_OFF = () => new THREE.Vector3(2.75, 5.3, 6.2).multiplyScalar(fitScale());   // 選島的鏡頭偏移
const ITEM_OFF = () => new THREE.Vector3(1.7, 3.5, 3.5).multiplyScalar(fitScale());   // 選建物的鏡頭偏移（俯角較高，前景的路燈、樹、小人才不會擋住）
const ISL_DIST = Math.hypot(2.75, 5.3, 6.2);

/* 依面板位置調整取景：桌面左側有卡片時目標往右偏 1.5；右側清單打開時往左讓；
   手機橫拿的左右側欄同理（依實際寬度算）；手機直式的底部面板打開時往上讓 */
function framedPose(target, offset){
  const dist = offset.length(), view = offset.clone().normalize().negate();
  const right = new THREE.Vector3().crossVectors(view, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, view).normalize();
  const look = target.clone();
  const W = glEl.clientWidth || 1;
  const viewW = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;   // 目標距離處的畫面寬度
  if (!isMobile()){
    let sx = 0;
    if (state.cardOpen) sx += 1.5 * (dist / ISL_DIST) * ((cardEl.offsetWidth || 340) / 340);
    if (state.sideOpen && !state.present) sx -= ((sideEl.offsetWidth || 318) + 16) / 2 / W * viewW;
    look.addScaledVector(right, -sx);
  } else if (landMQ.matches){
    const panel = Math.min(380, innerWidth * 0.46);
    let sx = 0;
    if (state.cardOpen) sx += (cardEl.offsetWidth || panel) / 2 / W * viewW;
    else if (state.sideOpen) sx -= (sideEl.offsetWidth || panel) / 2 / W * viewW;
    look.addScaledVector(right, -sx);
  } else {
    const sheet = state.cardOpen ? (state.present ? 0.4 : 0.34) : state.sideOpen ? 0.52 : 0;
    const top = sheet ? (($('.brand').getBoundingClientRect().bottom || 0) + 44) / (glEl.clientHeight || 1) : 0;   // 上方品牌列（再留一顆 pin 的高度）也占掉一截，取景置中在兩者之間
    look.addScaledVector(up, -(2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (sheet - top) / 2);
  }
  return { pos: look.clone().add(offset), target: look };
}
function overviewPose(){
  const tall = glEl.clientWidth / Math.max(1, glEl.clientHeight) < 0.8;
  return framedPose(CITY.v.clone(), tall ? tallOverviewOffset() : OV_DIR.clone().multiplyScalar(overviewDist()));
}
function birdPose(){ return framedPose(CITY.v.clone(), new THREE.Vector3(0.01, 42, 6)); }   // 鳥瞰：target + (0.01, 42, 6)

/* ── 相機飛行：800ms easeInOutCubic，同時插值位置與注視點 ── */
const fly = { on: false, t: 0, dur: 0.8, p0: null, p1: null, t0: null, t1: null };
function flyTo(pos, target, dur = 0.8){
  if (reduced || dur <= 0){
    camera.position.copy(pos); controls.target.copy(target); controls.update();
    fly.on = false; dirty = true; return;
  }
  fly.p0.copy(camera.position); fly.t0.copy(controls.target);
  fly.p1.copy(pos); fly.t1.copy(target);
  fly.t = 0; fly.dur = dur; fly.on = true;
}
function cancelFly(){ fly.on = false; }
function updateFly(dt){
  if (!fly.on) return false;
  fly.t = Math.min(1, fly.t + dt / fly.dur);
  const e = ease(fly.t);
  camera.position.lerpVectors(fly.p0, fly.p1, e);
  controls.target.lerpVectors(fly.t0, fly.t1, e);
  if (fly.t >= 1) fly.on = false;
  return true;
}
function flyOverview(){ const o = state.bird ? birdPose() : overviewPose(); state.view = 'overview'; flyTo(o.pos, o.target); }
function flyToIsland(i){
  const W = ISL[i], p = framedPose(new THREE.Vector3(W.x, TOP, W.z), ISL_OFF());
  state.view = 'island'; flyTo(p.pos, p.target);
}
function flyToItem(id){
  const ix = itemRoot.index.get(id);
  const p = framedPose(new THREE.Vector3(ix.x, TOP + (ix.top - TOP) * 0.4, ix.z), ITEM_OFF());
  state.view = 'item'; flyTo(p.pos, p.target);
}
function flyToPair(a, b){                                    // 協作線：同時看到兩座島
  const A = ISL[a], B = ISL[b], d = Math.hypot(A.x - B.x, A.z - B.z);
  const c = new THREE.Vector3((A.x + B.x) / 2, TOP, (A.z + B.z) / 2), dir = ISL_OFF().normalize();
  let dist = ISL_DIST + d * 0.95;
  if (isMobile()){                                            // 手機：扣掉面板占的地方，兩座島都要進畫面
    const land = landMQ.matches;
    dist = Math.max(dist, fitDist(c, dir, hexCorners([A, B]), land ? 0.5 : 0.86, land ? 0.8 : 0.6));
  }
  const p = framedPose(c, dir.multiplyScalar(dist));
  state.view = 'flow'; flyTo(p.pos, p.target);
}
/* 方向鍵轉動鏡頭 */
function nudgeCamera(dTheta, dPhi){
  const off = camera.position.clone().sub(controls.target), s = new THREE.Spherical().setFromVector3(off);
  s.theta += dTheta; s.phi = clamp(s.phi + dPhi, controls.minPolarAngle, controls.maxPolarAngle);
  off.setFromSpherical(s);
  if (state.view === 'overview') state.view = 'free';
  flyTo(controls.target.clone().add(off), controls.target.clone(), 0.25);
}

/* =====================================================================
 * 3. 環境：天空、霧、光、水
 * ===================================================================== */
let sky, hemi, sun, fill, water, bodyMat;
const U = {};                                     // 會隨日夜變化的共用 uniforms

const SKY_VS = /* glsl */`
  varying vec3 vDir;
  void main(){
    vDir = position;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
  }`;
const SKY_FS = /* glsl */`
  uniform vec3 uTop, uHorizon, uSunDir, uSun;
  uniform float uNight;
  varying vec3 vDir;
  float hash3(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
  void main(){
    vec3 d = normalize(vDir);
    vec3 col = mix(uHorizon, uTop, smoothstep(-0.02, 0.55, d.y));
    float s = max(dot(d, normalize(uSunDir)), 0.0);
    col += uSun * pow(s, 18.0) * 0.35;
    if (uNight > 0.001){
      vec3 c = floor(d * 180.0);
      float h = hash3(c);
      float dotShape = 1.0 - smoothstep(0.12, 0.38, length(fract(d * 180.0) - 0.5));
      float star = step(0.9965, h) * dotShape * smoothstep(0.02, 0.2, d.y);
      col += vec3(star * uNight * (0.55 + 0.45 * hash3(c + 1.7)));
    }
    gl_FragColor = vec4(col, 1.0);
    #include <colorspace_fragment>
  }`;

const WATER_VS = /* glsl */`
  varying vec3 vW;
  #include <common>
  #include <fog_pars_vertex>
  void main(){
    vec4 w = modelMatrix * vec4(position, 1.0);
    vW = w.xyz;
    vec4 mvPosition = viewMatrix * w;
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const WATER_FS = /* glsl */`
  uniform vec3 uShallow, uDeep, uFoam;
  uniform float uTime, uNight;
  uniform vec2 uCity;
  uniform vec2 uCenters[ISL_N];
  varying vec3 vW;
  #include <common>
  #include <fog_pars_fragment>
  float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float hexD(vec2 p){ p = abs(p); return max(p.x, p.x * 0.5 + p.y * 0.8660254) - ISL_R * 0.8660254; }
  void main(){
    vec2 p = vW.xz;
    float d = 1e3;
    for (int i = 0; i < ISL_N; i++) d = min(d, hexD(p - uCenters[i]));
    float far = smoothstep(9.0, 70.0, length(p - uCity));          // 越遠越深
    vec3 col = mix(uShallow, uDeep, 0.3 + 0.7 * far);
    float w1 = sin(p.x * 0.55 + uTime * 0.6 + sin(p.y * 0.35 + uTime * 0.3) * 1.4);
    float w2 = sin(p.y * 0.7 - uTime * 0.5 + sin(p.x * 0.4 - uTime * 0.25) * 1.2);
    col *= 1.0 + w1 * w2 * 0.045;                                    // 兩組交疊正弦波色彩漂移
    col = mix(col, uShallow * 1.08, 0.08 * (w1 * 0.5 + 0.5) * (1.0 - far));
    float sh = 1.0 - smoothstep(0.0, 0.7, d);                        // 淺水環 R+0.7
    col = mix(col, uShallow * 1.16 + 0.025, sh * 0.8);
    float fw = 0.16 + sin(p.x * 3.1 + uTime * 1.3) * sin(p.y * 2.9 - uTime) * 0.025;
    float foam = (1.0 - smoothstep(fw - 0.05, fw, d)) * step(-0.05, d); // 白色泡沫環 R+0.16
    col = mix(col, uFoam, foam * 0.55);
    vec2 gq = p * 5.0, cell = floor(gq), fc = fract(gq) - 0.5;
    float glint = 1.0 - smoothstep(0.04, 0.13, length(fc * vec2(1.0, 2.4)));
    float sp = step(0.986, hash2(cell + floor(uTime * 1.5))) * glint * (w1 * 0.5 + 0.5) * (1.0 - uNight) * (1.0 - far * 0.8);
    col += sp * 0.5;                                                 // 微小閃光
    gl_FragColor = vec4(col, 1.0);
    #include <colorspace_fragment>
    #include <fog_fragment>
  }`;

/* 島嶼側壁：頂緣彩色圖案帶 + 崖壁紋理 + 水線泡沫（水面 shader 同一套水色） */
const BODY_VS = /* glsl */`
  attribute vec3 aCenter;
  attribute vec3 aTint;
  attribute float aPat;
  varying vec3 vW; varying vec3 vL; varying vec3 vN; varying vec3 vTint; varying float vPat;
  #include <common>
  #include <fog_pars_vertex>
  void main(){
    vec4 w = modelMatrix * vec4(position, 1.0);
    vW = w.xyz; vL = w.xyz - aCenter;
    vN = normalize(mat3(modelMatrix) * normal);
    vTint = aTint; vPat = aPat;
    vec4 mvPosition = viewMatrix * w;
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const BODY_FS = /* glsl */`
  uniform vec3 uSunDir, uSunCol, uHemiSky, uHemiGround, uCream, uCliff, uWater, uFoam;
  uniform float uSunI, uHemiI, uTime;
  varying vec3 vW; varying vec3 vL; varying vec3 vN; varying vec3 vTint; varying float vPat;
  #include <common>
  #include <fog_pars_fragment>
  void main(){
    vec3 n = normalize(vN);
    float ang = atan(vL.z, vL.x);
    float u = (ang / 6.2831853 + 0.5) * 42.0;
    vec3 base;
    float bandBot = TOP_Y - 0.16;
    if (n.y > 0.5){
      base = mix(vTint, uCream, 0.25);                               // 島緣上方的細邊
    } else if (n.y < -0.5){
      base = uCliff * 0.4;
    } else if (vW.y > bandBot){
      float v = (vW.y - bandBot) / 0.16;
      float m;
      if (vPat < 0.5)      m = step(0.5, fract(u));                                      // 條紋
      else if (vPat < 1.5) m = step(v, abs(fract(u) - 0.5) * 1.6 + 0.1);                 // 鋸齒
      else { vec2 g = vec2(fract(u) - 0.5, (v - 0.5) * 0.9); m = 1.0 - smoothstep(0.22, 0.29, length(g)); } // 圓點
      base = mix(vTint, uCream, m * 0.82);
      base *= mix(0.8, 1.0, smoothstep(0.0, 0.14, v));
    } else {
      float s = sin(vW.y * 30.0 + sin(ang * 3.0) * 0.8) * 0.5 + 0.5;
      base = uCliff * (0.93 + 0.07 * s);
      base *= mix(0.84, 1.0, smoothstep(bandBot - 0.18, bandBot, vW.y));
      float wet = 1.0 - smoothstep(WATER_Y, WATER_Y + 0.16, vW.y);
      base = mix(base, base * 0.7 + uWater * 0.15, wet);
    }
    float ndl = max(dot(n, uSunDir), 0.0);
    vec3 irr = mix(uHemiGround, uHemiSky, 0.5 + 0.5 * n.y) * uHemiI + uSunCol * uSunI * ndl;
    vec3 col = base * irr * RECIPROCAL_PI;
    float wl = WATER_Y + 0.025 + sin(ang * 11.0 + uTime * 1.7) * 0.012;
    float foam = 1.0 - smoothstep(0.0, 0.03, abs(vW.y - wl));
    col = mix(col, uFoam, foam * 0.5);
    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    #include <fog_fragment>
  }`;

function initEnvironment(){
  /* 天空球：跟著相機，畫在最後面 */
  U.sky = {
    uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSun: { value: new THREE.Color() }, uNight: { value: 0 },
  };
  sky = new THREE.Mesh(new THREE.SphereGeometry(170, 32, 16),
    new THREE.ShaderMaterial({ uniforms: U.sky, vertexShader: SKY_VS, fragmentShader: SKY_FS,
      side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false, toneMapped: false }));
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);

  /* 霧：顏色跟著地平線 */
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);

  /* 光：半球光 + 太陽（唯一投影）+ 補光 */
  hemi = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.3);
  scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff1de, 2.8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 22, bottom: -22, near: 1, far: 90 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.045; sun.shadow.radius = 3;
  scene.add(sun, sun.target);
  fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.set(-20, 18, -14);

const KEY_RAW = [
  //  分鐘   skyTop    horizon   sunColor  sunI   hemiSky   hemiGround hemiI night water
  [   0, '1e2c58', '3f4f80', 'b4c2ff', 1.15, '94a2d8', '64566a', 1.85, 1.00, '5a88b2'],

  [1440, '1e2c58', '3f4f80', 'b4c2ff', 1.15, '94a2d8', '64566a', 1.85, 1.00, '5a88b2'],
];
let KEYS, ENV, SUN_DIR, DEEP_K, FOAM_DAY, FOAM_NIGHT;
function initDayCycle(){
  const C = h => new THREE.Color('#' + h);
  KEYS = KEY_RAW.map(k => ({ m: k[0], top: C(k[1]), hor: C(k[2]), sun: C(k[3]), sunI: k[4], hs: C(k[5]), hg: C(k[6]), hI: k[7], night: k[8], water: C(k[9]) }));
  ENV = { top: new THREE.Color(), hor: new THREE.Color(), sun: new THREE.Color(), hs: new THREE.Color(), hg: new THREE.Color(), water: new THREE.Color(), sunI: 0, hI: 0, night: 0 };
  SUN_DIR = new THREE.Vector3();
  DEEP_K = new THREE.Color(0.68, 0.80, 0.84);           // 深水 = 淺水 × 比例（#6fa9b8 / #a4d4da）
  FOAM_DAY = new THREE.Color('#f6fbfb'); FOAM_NIGHT = new THREE.Color('#7b88b4');
}
function sampleEnv(m){
  m = ((m % 1440) + 1440) % 1440;
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1].m <= m) i++;
  const a = KEYS[i], b = KEYS[i + 1], t = (m - a.m) / (b.m - a.m);
  for (const k of ['top', 'hor', 'sun', 'hs', 'hg', 'water']) ENV[k].lerpColors(a[k], b[k], t);
  ENV.sunI = a.sunI + (b.sunI - a.sunI) * t;
  ENV.hI = a.hI + (b.hI - a.hI) * t;
  ENV.night = a.night + (b.night - a.night) * t;
}
function sunDirection(m){
  const mq = Math.floor(m / 10) * 10;                    // 時間量化到 10 分鐘
  const t = clamp((mq - 360) / 720, 0, 1);
  const az = Math.PI * (0.15 + 0.7 * t);
  const el = 0.35 + Math.sin(t * Math.PI) * 0.75;
  return SUN_DIR.set(Math.cos(az) * Math.cos(el), Math.sin(el), 0.55 * Math.cos(el) + 0.35).normalize();
}
function applyDayCycle(m){
  sampleEnv(m);
  sunDirection(m);
  U.sky.uTop.value.copy(ENV.top); U.sky.uHorizon.value.copy(ENV.hor);
  U.sky.uSun.value.copy(ENV.sun); U.sky.uNight.value = ENV.night; U.sky.uSunDir.value.copy(SUN_DIR);
  scene.fog.color.copy(ENV.hor);
  hemi.color.copy(ENV.hs); hemi.groundColor.copy(ENV.hg); hemi.intensity = ENV.hI;
  sun.color.copy(ENV.sun); sun.intensity = ENV.sunI;
  sun.position.copy(CITY.v).addScaledVector(SUN_DIR, 40);
  sun.target.position.copy(CITY.v); sun.target.updateMatrixWorld();
  U.water.uShallow.value.copy(ENV.water);
  U.water.uDeep.value.copy(ENV.water).multiply(DEEP_K);
  U.water.uFoam.value.lerpColors(FOAM_DAY, FOAM_NIGHT, ENV.night);
  U.water.uNight.value = ENV.night;
  U.body.uSunDir.value.copy(SUN_DIR); U.body.uSunCol.value.copy(ENV.sun); U.body.uSunI.value = ENV.sunI;
  U.body.uHemiSky.value.copy(ENV.hs); U.body.uHemiGround.value.copy(ENV.hg); U.body.uHemiI.value = ENV.hI;
  U.body.uWater.value.copy(ENV.water); U.body.uFoam.value.lerpColors(FOAM_DAY, FOAM_NIGHT, ENV.night);
  MAT.glow.emissiveIntensity = ENV.night * 3.2;          // 夜晚窗戶與燈：night × 3.2
  MAT.pool.opacity = ENV.night * 0.6;                    // 路燈光池、窗光溢出：乘 night
  MAT.pool.visible = ENV.night > 0.02;
  if (SCENERY.cloudMat) SCENERY.cloudMat.emissiveIntensity = 0.18 * (1 - ENV.night);
  dirty = true;
}
function updateClock(dt){
  if (!clock.running || reduced) return false;
  clock.min = (clock.min + dt * 10) % 1440;
  return true;
}

/* =====================================================================
 * 5. 程序貼圖（canvas 即時畫，256²）
 * ===================================================================== */
function canvasTex(draw, size = 256){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
let TEX;
function initTextures(){
  const rr = rngFor('textures');
  TEX = {
    brick: canvasTex((g, s) => {                         // 磚紋
      g.fillStyle = '#e9dfd2'; g.fillRect(0, 0, s, s);
      const bw = 64, bh = 32, cols = s / bw, rows = s / bh;
      const shade = Array.from({ length: rows }, () => Array.from({ length: cols }, () => 248 - rr() * 16));
      for (let row = 0; row < rows; row++){
        const off = row % 2 ? bw / 2 : 0;
        for (let c = -1; c <= cols; c++){
          const v = shade[row][((c % cols) + cols) % cols];
          g.fillStyle = `rgb(${v},${v - 5},${v - 12})`;
          g.beginPath(); g.roundRect(c * bw + off + 2, row * bh + 2, bw - 4, bh - 4, 5); g.fill();
        }
      }
    }),
    speckle: canvasTex((g, s) => {                       // 斑點
      g.fillStyle = '#f5eee5'; g.fillRect(0, 0, s, s);
      for (let i = 0; i < 700; i++){
        const x = rr() * s, y = rr() * s, r = 1 + rr() * 2.6, dark = rr() < 0.7;
        g.fillStyle = dark ? `rgba(150,120,90,${0.10 + rr() * 0.12})` : `rgba(255,255,255,${0.5 + rr() * 0.4})`;
        for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]){ g.beginPath(); g.arc(x + ox, y + oy, r, 0, Math.PI * 2); g.fill(); }
      }
    }),
    stripe: canvasTex((g, s) => {                        // 斜條紋
      g.fillStyle = '#f4ede4'; g.fillRect(0, 0, s, s);
      g.fillStyle = '#e8ddcf';
      for (let k = -s; k < s * 2; k += 32){
        g.beginPath(); g.moveTo(k, 0); g.lineTo(k + 12, 0); g.lineTo(k + 12 - s, s); g.lineTo(k - s, s); g.closePath(); g.fill();
      }
    }),
    glow: canvasTex((g, s) => {                          // 光池用的放射漸層
      const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
    }, 128),
  };
  TEX.glow.wrapS = TEX.glow.wrapT = THREE.ClampToEdgeWrapping;
}

/* =====================================================================
 * 6. 零件庫 kit：建模函式只推 {kind, matrix, color}，最後每種 kind 一個 InstancedMesh
 * ===================================================================== */
let GEO, MAT;
function initKit(){
  const prism = () => {                                   // 三角柱（人字屋頂）
    const A = [-0.5, 0], B = [0.5, 0], C = [0, 1], f = 0.5, b = -0.5;
    const v = (p, z) => [p[0], p[1], z];
    const tris = [
      v(A, f), v(B, f), v(C, f),   v(A, b), v(C, b), v(B, b),
      v(B, f), v(B, b), v(C, b),   v(B, f), v(C, b), v(C, f),
      v(A, f), v(C, f), v(C, b),   v(A, f), v(C, b), v(A, b),
      v(A, f), v(A, b), v(B, b),   v(A, f), v(B, b), v(B, f),
    ].flat();
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(tris, 3));
    g.computeVertexNormals();
    return g;
  };
  GEO = {
    box:      new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0),
    rbox:     new RoundedBoxGeometry(1, 1, 1, 2, 0.12).translate(0, 0.5, 0),
    cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 14).translate(0, 0.5, 0),
    cone:     new THREE.ConeGeometry(0.5, 1, 14).translate(0, 0.5, 0),
    sphere:   new THREE.SphereGeometry(0.5, 14, 10).translate(0, 0.5, 0),
    ico:      new THREE.IcosahedronGeometry(0.5, 1).translate(0, 0.5, 0),
    dome:     new THREE.SphereGeometry(0.5, 14, 5, 0, Math.PI * 2, 0, Math.PI / 2),
    torus:    new THREE.TorusGeometry(0.4, 0.06, 10, 28),
    prism:    prism(),
    hip:      new THREE.ConeGeometry(Math.SQRT1_2, 1, 4).rotateY(Math.PI / 4).translate(0, 0.5, 0),
  };
  GEO.glowbox = GEO.box; GEO.glowsphere = new THREE.SphereGeometry(0.5, 12, 8).translate(0, 0.5, 0);
  GEO.glowbead = new THREE.IcosahedronGeometry(0.5, 0).translate(0, 0.5, 0);   // 島緣串燈的小燈珠（面數少）
  GEO.pool = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);              // 夜間地面光池
  MAT = {
    solid: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.78, metalness: 0 }),
    glow:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0, emissive: 0xffc777, emissiveIntensity: 0 }),
    pool:  new THREE.MeshBasicMaterial({ map: TEX.glow, color: 0xffc777, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
      depthWrite: false, toneMapped: false, fog: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }),
  };
}
const matFor = kind => kind === 'pool' ? MAT.pool : kind.startsWith('glow') ? MAT.glow : MAT.solid;

function M(x, y, z, sx, sy, sz, ry = 0, rx = 0, rz = 0){
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz));
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(sx, sy, sz));
}

class Kit {
  constructor(seedName){ this.rng = rngFor(seedName); this.parts = []; }
  add(kind, matrix, color, owner = null){
    if (!GEO[kind]) throw new Error('未知的零件種類：' + kind);
    this.parts.push({ kind, matrix, color: new THREE.Color(color), owner });
    return this;
  }
  build(parent, { cast = true, receive = true } = {}){
    const byKind = new Map();
    for (const p of this.parts){ if (!byKind.has(p.kind)) byKind.set(p.kind, []); byKind.get(p.kind).push(p); }
    const meshes = [], owners = new Map(), S = new THREE.Matrix4();
    for (const [kind, list] of byKind){
      const mat = matFor(kind), solid = mat === MAT.solid;
      const mesh = new THREE.InstancedMesh(GEO[kind], mat, list.length);
      mesh.castShadow = cast && solid; mesh.receiveShadow = receive && kind !== 'pool';
      mesh.userData.owners = list.map(p => p.owner);   // 點選時由 instanceId 找回細項
      list.forEach((p, i) => {
        const j = 1 + (this.rng() * 2 - 1) * 0.0072;   // 縮放 1 ± 0.0072 抖動，避免面重疊閃爍
        mesh.setMatrixAt(i, S.makeScale(j, j, j).premultiply(p.matrix));
        mesh.setColorAt(i, p.color);
        if (p.owner){ if (!owners.has(p.owner)) owners.set(p.owner, []); owners.get(p.owner).push({ mesh, i, color: p.color }); }
      });
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      parent.add(mesh); meshes.push(mesh);
    }
    return { meshes, owners, dispose(){ for (const m of meshes){ parent.remove(m); m.dispose(); } } };
  }
}
function tintOwner(built, owner, target, amt){
  const parts = built && built.owners.get(owner);
  if (!parts) return;
  const c = new THREE.Color();
  for (const p of parts){
    c.copy(p.color); if (target && amt > 0) c.lerp(target, amt);
    p.mesh.setColorAt(p.i, c); p.mesh.instanceColor.needsUpdate = true;
  }
}

/* =====================================================================
 * 7. 世界佈局：六角島、步道環、路緣、橋
 * ===================================================================== */
let ISL = [];                                     // 每個島位的世界座標與網格參照
const islandGroup = { tops: [], body: null };

function hexRingGeo(rIn, rOut, y, cx, cz, uvScale){       // 平面六角環（外接半徑）
  const pos = [], uv = [];
  const P = (r, k) => { const a = (30 + 60 * k) * Math.PI / 180; return [cx + r * Math.cos(a), y, cz + r * Math.sin(a)]; };
  for (let k = 0; k < 6; k++){
    const i0 = P(rIn, k), i1 = P(rIn, k + 1), o0 = P(rOut, k), o1 = P(rOut, k + 1);
    for (const p of [i0, o1, o0, i0, i1, o1]){ pos.push(...p); uv.push(p[0] / uvScale, p[2] / uvScale); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}
function hexBandGeo(rIn, rOut, y0, y1, cx, cz){            // 有高度的六角環（路緣）
  const pos = [];
  const P = (r, k, y) => { const a = (30 + 60 * k) * Math.PI / 180; return [cx + r * Math.cos(a), y, cz + r * Math.sin(a)]; };
  for (let k = 0; k < 6; k++){
    const i0 = P(rIn, k, y1), i1 = P(rIn, k + 1, y1), o0 = P(rOut, k, y1), o1 = P(rOut, k + 1, y1);
    pos.push(...i0, ...o1, ...o0, ...i0, ...i1, ...o1);                 // 頂面
    const a0 = P(rOut, k, y0), a1 = P(rOut, k + 1, y0);
    pos.push(...a0, ...o1, ...a1, ...a0, ...o0, ...o1);                 // 外側面
    const b0 = P(rIn, k, y0), b1 = P(rIn, k + 1, y0);
    pos.push(...b0, ...b1, ...i1, ...b0, ...i1, ...i0);                 // 內側面
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function initLayout(){
  ISL = DATA.layout.slots.map((s, i) => { const p = axial(s.q, s.r); return { i, q: s.q, r: s.r, x: p.x, z: p.z, pat: i % 3 }; });
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const W of ISL){ minX = Math.min(minX, W.x); maxX = Math.max(maxX, W.x); minZ = Math.min(minZ, W.z); maxZ = Math.max(maxZ, W.z); }
  CITY.x = (minX + maxX) / 2; CITY.z = (minZ + maxZ) / 2;
  CITY.v = new THREE.Vector3(CITY.x, 0.4, CITY.z);
  OV_DIR = new THREE.Vector3(0.24, 0.33, 0.87).normalize();
  fly.p0 = new THREE.Vector3(); fly.p1 = new THREE.Vector3(); fly.t0 = new THREE.Vector3(); fly.t1 = new THREE.Vector3();
}

function initIslands(){
  /* 島面：三種程序貼圖各合併成一個網格，用頂點色上島色 */
  const texList = [TEX.brick, TEX.speckle, TEX.stripe];
  for (let p = 0; p < 3; p++){
    const geos = [];
    ISL.filter(W => W.pat === p).forEach((W, k) => {
      const g = new THREE.CircleGeometry(R - 0.05, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2).translate(W.x, TOP, W.z);
      const pos = g.attributes.position, uv = g.attributes.uv, n = pos.count;
      for (let v = 0; v < n; v++) uv.setXY(v, pos.getX(v) / 2.2, pos.getZ(v) / 2.2);   // UV = 世界座標 ÷ 2.2
      g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(n * 3).fill(1), 3));
      W.top = { group: p, start: k * n, count: n };
      geos.push(g);
    });
    const mesh = new THREE.Mesh(BGU.mergeGeometries(geos), new THREE.MeshStandardMaterial({
      map: texList[p], vertexColors: true, roughness: 0.92, metalness: 0,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2,
    }));
    mesh.receiveShadow = true;
    scene.add(mesh); islandGroup.tops[p] = mesh;
  }

  /* 島身側壁：六角柱，合併成一個網格 */
  const bodies = ISL.map(W => {
    const g = new THREE.CylinderGeometry(R, R, TOP - BODY_BOTTOM, 6, 1, false).toNonIndexed();
    g.computeVertexNormals();
    g.translate(W.x, (TOP + BODY_BOTTOM) / 2, W.z);
    const n = g.attributes.position.count;
    g.setAttribute('aCenter', new THREE.Float32BufferAttribute(new Float32Array(n * 3).map((_, j) => j % 3 === 0 ? W.x : j % 3 === 1 ? TOP : W.z), 3));
    g.setAttribute('aTint', new THREE.Float32BufferAttribute(new Float32Array(n * 3).fill(1), 3));
    g.setAttribute('aPat', new THREE.Float32BufferAttribute(new Float32Array(n).fill(W.pat), 1));
    W.body = { start: W.i * n, count: n };
    return g;
  });
  islandGroup.body = new THREE.Mesh(BGU.mergeGeometries(bodies), bodyMat);
  scene.add(islandGroup.body);

  /* 步道環（半徑 1.8、寬 .28、淺磚色）與路緣 */
  const cIn = WALK_R * HEX_IN;                               // 步道中線的內切半徑
  const inr = [cIn - WALK_W / 2, cIn + WALK_W / 2];
  const toC = r => r / HEX_IN;                               // 內切 → 外接
  const walk = ISL.map(W => hexRingGeo(toC(inr[0]), toC(inr[1]), WALK_Y, W.x, W.z, 0.75));
  const walkMesh = new THREE.Mesh(BGU.mergeGeometries(walk), new THREE.MeshStandardMaterial({
    color: PAL.walk, map: TEX.brick, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }));
  walkMesh.receiveShadow = true; scene.add(walkMesh);

  const curbs = [];
  for (const W of ISL){
    curbs.push(hexBandGeo(toC(inr[0] - 0.035), toC(inr[0]), TOP, TOP + 0.028, W.x, W.z));
    curbs.push(hexBandGeo(toC(inr[1]), toC(inr[1] + 0.03), TOP, TOP + 0.028, W.x, W.z));
  }
  const curbMesh = new THREE.Mesh(BGU.mergeGeometries(curbs), new THREE.MeshStandardMaterial({ color: PAL.curb, roughness: 0.85 }));
  curbMesh.receiveShadow = true; scene.add(curbMesh);
}

/* 依地圖替島嶼上色：島面＝奶油色混島色、側壁圖案帶＝島色 */
function paintIslands(map){
  const cream = new THREE.Color(PAL.cream);
  map.islands.forEach((isl, i) => {
    const W = ISL[i], tint = new THREE.Color(isl.tint || PAL.stone);
    const ground = cream.clone().lerp(tint, 0.3);

/* ── 行人路網：每島 12 節點成環，橋連相鄰島，Dijkstra 尋路 ── */
const NET = { nodes: [], adj: [], bridges: [] };
function buildNetwork(){
  ISL.forEach((W, i) => {
    for (let j = 0; j < 12; j++){
      const a = j * Math.PI / 6;
      const r = j % 2 === 0 ? WALK_R * HEX_IN : WALK_R;       // 偶數＝邊中點、奇數＝頂點
      NET.nodes.push({ x: W.x + r * Math.cos(a), y: WALK_Y, z: W.z + r * Math.sin(a), island: i });
      NET.adj.push([]);
    }
  });
  const link = (a, b, bridge = -1) => {
    const A = NET.nodes[a], B = NET.nodes[b], w = Math.hypot(A.x - B.x, A.z - B.z);
    NET.adj[a].push({ to: b, w, bridge }); NET.adj[b].push({ to: a, w, bridge });
  };
  ISL.forEach((W, i) => { for (let j = 0; j < 12; j++) link(i * 12 + j, i * 12 + (j + 1) % 12); });
  const rr = rngFor('bridges');
  for (let i = 0; i < ISL.length; i++) for (let j = i + 1; j < ISL.length; j++){
    const dx = ISL[j].x - ISL[i].x, dz = ISL[j].z - ISL[i].z;
    if (Math.abs(Math.hypot(dx, dz) - SQ3 * SPACING) > 0.01) continue;   // 只有相鄰島才架橋
    const k = ((Math.round(Math.atan2(dz, dx) / (Math.PI / 3)) % 6) + 6) % 6;
    const a = i * 12 + 2 * k, b = j * 12 + 2 * ((k + 3) % 6);
    NET.bridges.push({ a, b, i, j, h: 0.04 + rr() * 0.06 });           // 拱高 .04–.1
    link(a, b, NET.bridges.length - 1);
  }
}
function dijkstra(src, dst){
  const n = NET.nodes.length, dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), done = new Uint8Array(n);
  dist[src] = 0;
  for (let it = 0; it < n; it++){
    let u = -1, best = Infinity;
    for (let v = 0; v < n; v++) if (!done[v] && dist[v] < best){ best = dist[v]; u = v; }
    if (u < 0 || u === dst) break;
    done[u] = 1;
    for (const e of NET.adj[u]){ const nd = dist[u] + e.w; if (nd < dist[e.to]){ dist[e.to] = nd; prev[e.to] = u; } }
  }
  const path = [];
  for (let v = dst; v >= 0; v = prev[v]){ path.unshift(v); if (v === src) break; }
  return path[0] === src ? path : [];
}

/* ── 靜態物件（橋）：9 片甲板、sin 拱形、欄杆 ── */
let staticBuilt = null;
function buildStatic(){
  const kit = new Kit('static');
  for (const b of NET.bridges){
    const A = NET.nodes[b.a], B = NET.nodes[b.b];
    const dx = B.x - A.x, dz = B.z - A.z, L = Math.hypot(dx, dz), ang = Math.atan2(dz, dx), ry = -ang;
    const px = -Math.sin(ang), pz = Math.cos(ang);           // 橋的橫向
    const N = 9, seg = L / N;
    const yAt = t => WALK_Y + 0.012 + b.h * Math.sin(Math.PI * t);
    for (let k = 0; k < N; k++){
      const t = (k + 0.5) / N, y = yAt(t);
      const slope = Math.atan(b.h * Math.PI * Math.cos(Math.PI * t) / L);
      const x = A.x + dx * t, z = A.z + dz * t;
      kit.add('box', M(x, y - 0.012, z, seg - 0.012, 0.024, 0.27, ry, 0, slope), k % 2 ? PAL.wood : '#c49770');
      for (const sd of [-1, 1]) kit.add('box', M(x + px * 0.125 * sd, y + 0.07, z + pz * 0.125 * sd, seg + 0.004, 0.016, 0.016, ry, 0, slope), PAL.cream);
    }
    for (const t of [0.04, 0.5, 0.96]) for (const sd of [-1, 1]){
      const x = A.x + dx * t + px * 0.125 * sd, z = A.z + dz * t + pz * 0.125 * sd;
      kit.add('cylinder', M(x, yAt(t) - 0.01, z, 0.026, 0.095, 0.026), t === 0.5 ? PAL.coral : PAL.cream);
    }
  }

  /* ── 街道家具：路燈、光池、島緣串燈（大物件，永遠顯示） ── */
  const bridgeDirs = ISL.map(() => new Set());           // 每座島哪幾個邊有橋（方向 0–5）
  for (const b of NET.bridges){ bridgeDirs[b.i].add((b.a % 12) / 2); bridgeDirs[b.j].add((b.b % 12) / 2); }
  const vtx = (W, k, r) => { const a = (30 + 60 * k) * Math.PI / 180; return { x: W.x + r * Math.cos(a), z: W.z + r * Math.sin(a) }; };
  const beadCols = [PAL.cream, PAL.yellow, PAL.accent[0], '#ffd9a8'];
  const small = new Kit('static-small');
  ISL.forEach((W, i) => {
    for (let k = 0; k < 6; k++){
      const v = vtx(W, k, 1.955);                          // 六角頂點路燈（步道外角，不擋行人）
      kit.add('cylinder', M(v.x, TOP, v.z, 0.075, 0.05, 0.075), '#3d4a52');
      kit.add('cylinder', M(v.x, TOP, v.z, 0.032, 0.46, 0.032), '#3d4a52');
      kit.add('glowsphere', M(v.x, TOP + 0.43, v.z, 0.1, 0.1, 0.1), PAL.cream);
      kit.add('cone', M(v.x, TOP + 0.51, v.z, 0.11, 0.06, 0.11), PAL.coral);
      const pc = vtx(W, k, 1.66);                          // 光池往島內收，避免浮在水面上
      kit.add('pool', M(pc.x, TOP + 0.012, pc.z, 0.7, 1, 0.7), '#ffffff');
      /* 島緣串燈：沿外側路緣，避開橋頭與路燈 */
      const a = vtx(W, k, 1.98), b = vtx(W, k + 1, 1.98), hasBridge = bridgeDirs[i].has((k + 1) % 6);
      for (let n = 0; n < 9; n++){
        const t = 0.12 + n * 0.095;
        if (hasBridge && Math.abs(t - 0.5) < 0.17) continue;
        kit.add('glowbead', M(a.x + (b.x - a.x) * t, TOP + 0.028, a.z + (b.z - a.z) * t, 0.045, 0.045, 0.045), beadCols[(n + k) % 4]);
      }
      /* 路緣上的小盆栽（夾在串燈之間，讓出步道給小人走；小物件，遠看時隱藏） */
      const p0 = vtx(W, k, 1.70 / HEX_IN), p1 = vtx(W, k + 1, 1.70 / HEX_IN);
      [0.25, 0.75].forEach((t, j) => {
        const x = p0.x + (p1.x - p0.x) * t, z = p0.z + (p1.z - p0.z) * t;
        small.add('cylinder', M(x, TOP + 0.028, z, 0.07, 0.05, 0.07), (k + j) % 2 ? '#c8734a' : PAL.stone);
        if ((k + j + i) % 2) small.add('ico', M(x, TOP + 0.07, z, 0.1, 0.09, 0.1), PAL.plant[(k + i) % 3]);
        else for (const [ox, oz, c] of [[-0.018, 0, PAL.accent[0]], [0.018, 0.008, PAL.yellow], [0, -0.018, PAL.coral]]) small.add('ico', M(x + ox, TOP + 0.08, z + oz, 0.042, 0.042, 0.042), c);
      });
    }
  });
  staticBuilt = kit.build(scene);
  staticSmall = small.build(scene, { cast: false });
}

/* ── 小物件 LOD：鏡頭距離 ≥ 26 時隱藏 ── */
const lod = { near: null };
function applyLOD(force = false){
  const near = camera.position.distanceTo(controls.target) < 26;
  if (!force && near === lod.near) return;
  lod.near = near;
  for (const m of [...(staticSmall ? staticSmall.meshes : []), ...(itemRoot.small ? itemRoot.small.meshes : [])]) m.visible = near;
  dirty = true;
}

/* =====================================================================
 * 8. 細項配置與模型
 *    主建物在 (0, −0.58)、約 1.15；其餘用交錯格子放在內切半徑 1.36 內，
 *    格子 0.62 依數量縮到 0.46。模型種類由 DATA 的 item.model 決定。
 * ===================================================================== */
const layoutCache = new Map();
function layoutItems(n){
  if (layoutCache.has(n)) return layoutCache.get(n);
  const out = [{ x: 0, z: -0.58, s: 1.15 }];
  const need = n - 1;
  if (need > 0){
    let g = Math.max(0.46, 0.62 - Math.max(0, need - 2) * 0.054);
    for (; g >= 0.4; g -= 0.03){
      const cands = [], rowH = g * HEX_IN, lim = 1.36 - g * 0.45, ex = 0.575 + g * 0.42;
      for (let row = -8; row <= 8; row++){
        const z = row * rowH, off = row & 1 ? g / 2 : 0;
        for (let col = -8; col <= 8; col++){
          const x = col * g + off;
          if (hexDist(x, z) > lim) continue;
          if (Math.abs(x) < ex && Math.abs(z + 0.58) < ex) continue;   // 避開主建物
          cands.push({ x, z });
        }
      }
      if (cands.length < need) continue;
      const chosen = [], refs = [{ x: 0, z: -0.58 }];
      const d2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;
      let first = cands[0];
      for (const c of cands) if (d2(c, { x: 0, z: 0.9 }) < d2(first, { x: 0, z: 0.9 })) first = c;
      chosen.push(first);
      while (chosen.length < need){                                      // 最遠點取樣，讓細項分散
        let best = null, bestD = -1;
        for (const c of cands){
          if (chosen.includes(c)) continue;
          const dmin = Math.min(...chosen.concat(refs).map(p => d2(p, c)));
          if (dmin > bestD + 1e-9){ bestD = dmin; best = c; }
        }
        chosen.push(best);
      }
      chosen.sort((a, b) => a.x - b.x || a.z - b.z);
      for (const c of chosen) out.push({ x: c.x, z: c.z, s: g * 0.8 });
      break;
    }
  }
  layoutCache.set(n, out);
  return out;
}

function tree(kit, sp, x, z, k){
  const trunk = (h, w = 0.07) => kit.add('cylinder', M(x, TOP, z, w * k, h * k, w * k), sp.trunk);
  const leaf = (kind, dx, y, dz, sx, sy, sz) => kit.add(kind, M(x + dx * k, TOP + y * k, z + dz * k, sx * k, sy * k, sz * k), sp.leaf);
  switch (sp.shape){
    case 'round':    trunk(0.3); leaf('ico', 0, 0.22, 0, 0.46, 0.44, 0.46); break;
    case 'pine':     trunk(0.18); leaf('cone', 0, 0.12, 0, 0.5, 0.36, 0.5); leaf('cone', 0, 0.32, 0, 0.4, 0.3, 0.4); leaf('cone', 0, 0.5, 0, 0.28, 0.26, 0.28); break;
    case 'puff':     trunk(0.32); leaf('ico', 0, 0.3, 0, 0.34, 0.3, 0.34); leaf('ico', -0.1, 0.26, 0.05, 0.26, 0.24, 0.26); leaf('ico', 0.1, 0.26, -0.04, 0.26, 0.24, 0.26); leaf('ico', 0, 0.46, 0, 0.24, 0.22, 0.24); break;
    case 'cypress':  trunk(0.14, 0.06); leaf('ico', 0, 0.1, 0, 0.26, 0.78, 0.26); break;
    case 'lollipop': trunk(0.5, 0.045); leaf('sphere', 0, 0.42, 0, 0.34, 0.34, 0.34); break;

/* ── 島內裝飾：4–6 棵大樹（避開細項、不擋正前方）＋長椅、垃圾桶、花叢 ── */
function placeDecor(kit, small, i, slots){
  const W = ISL[i], rr = rngFor('decor-' + i + '-' + slots.length), sp = TREE_SPECIES[i % TREE_SPECIES.length];
  const blocked = (x, z, pad) => {
    if (Math.abs(x) < 0.575 + pad && Math.abs(z + 0.58) < 0.575 + pad) return true;          // 主建物
    for (let k = 1; k < slots.length; k++) if (Math.hypot(x - slots[k].x, z - slots[k].z) < slots[k].s * 0.55 + pad) return true;
    return false;
  };
  const cands = [];
  for (let k = 0; k < 6; k++){ const a = (30 + 60 * k) * Math.PI / 180; cands.push({ x: 1.46 * Math.cos(a), z: 1.46 * Math.sin(a), corner: 1 }); }
  const g = 0.24;
  for (let row = -8; row <= 8; row++) for (let col = -8; col <= 8; col++){
    const z = row * g * HEX_IN, x = col * g + (row & 1 ? g / 2 : 0);
    if (hexDist(x, z) <= 1.24) cands.push({ x, z, corner: 0 });
  }
  const far = (list, c, d) => list.every(o => Math.hypot(o.x - c.x, o.z - c.z) >= d);
  /* 大樹 */
  const want = 4 + (i % 3), trees = [];
  for (const strict of [true, false]){
    const ok = cands.filter(c => !blocked(c.x, c.z, strict ? 0.2 : 0.14) && (strict ? c.z <= 0.75 && !(Math.abs(c.x) < 0.55 && c.z > 0.25) : true))
      .map(c => ({ ...c, score: c.corner * 2 + hexDist(c.x, c.z) + rr() * 0.3 })).sort((a, b) => b.score - a.score);
    for (const c of ok){ if (trees.length >= want) break; if (far(trees, c, 0.44)) trees.push(c); }
    if (trees.length >= 4) break;
  }
  for (const t of trees) tree(kit, sp, W.x + t.x, W.z + t.z, 0.88 + rr() * 0.24);
  /* 長椅（面向步道）與垃圾桶 */
  const benches = [];
  const ring = cands.filter(c => !c.corner && hexDist(c.x, c.z) > 1.08 && !blocked(c.x, c.z, 0.12) && far(trees, c, 0.32))
    .map(c => ({ ...c, score: rr() })).sort((a, b) => b.score - a.score);
  for (const c of ring){
    if (benches.length >= 2) break;
    if (!far(benches, c, 0.8)) continue;
    benches.push(c);
    const phi = Math.atan2(c.z, c.x), ry = Math.PI / 2 - phi, x = W.x + c.x, z = W.z + c.z;
    const L = (lx, ly, lz, sx, sy, sz, col) => {
      const m = new THREE.Matrix4().makeTranslation(x, TOP, z).multiply(new THREE.Matrix4().makeRotationY(ry)).multiply(M(lx, ly, lz, sx, sy, sz));
      small.add('box', m, col);
    };
    L(0, 0.05, 0, 0.2, 0.022, 0.07, C.wood);
    L(0, 0.072, -0.03, 0.2, 0.06, 0.015, C.wood);
    for (const sx of [-0.08, 0.08]) L(sx, 0, 0, 0.018, 0.05, 0.06, C.ink);
    small.add('cylinder', M(x + Math.cos(phi + 1.57) * 0.16, TOP, z + Math.sin(phi + 1.57) * 0.16, 0.06, 0.09, 0.06), C.teal);
  }
  /* 花叢與灌木 */
  const used = trees.concat(benches);
  let n = 0;
  for (const c of cands.filter(c => !c.corner && !blocked(c.x, c.z, 0.1)).map(c => ({ ...c, score: rr() })).sort((a, b) => b.score - a.score)){
    if (n >= 5) break;
    if (!far(used, c, 0.28)) continue;
    used.push(c); n++;
    const x = W.x + c.x, z = W.z + c.z;
    if (n % 2) small.add('ico', M(x, TOP, z, 0.16, 0.12, 0.16), PAL.plant[(n + i) % 3]);
    else for (const [ox, oz, col] of [[-0.03, 0, C.pink], [0.03, 0.015, C.yellow], [0, -0.03, C.cream], [0.015, 0.035, C.roof]]){
      small.add('cylinder', M(x + ox, TOP, z + oz, 0.012, 0.05, 0.012), C.green);
      small.add('ico', M(x + ox, TOP + 0.045, z + oz, 0.045, 0.04, 0.045), col);
    }
  }
  return trees.length;
}

const itemRoot = { group: null, built: null, small: null, index: new Map(), trees: [] };

function buildItems(map){
  if (itemRoot.built) itemRoot.built.dispose();
  if (itemRoot.small) itemRoot.small.dispose();
  itemRoot.index.clear(); itemRoot.trees = [];
  const kit = new Kit('items-' + map.id), small = new Kit('deco-' + map.id), rr = rngFor('yaw-' + map.id);
  const up = new THREE.Vector3(0, 1, 0);
  map.islands.forEach((isl, i) => {
    const W = ISL[i], slots = layoutItems(isl.items.length);
    isl.items.forEach((it, k) => {
      const sl = slots[k], x = W.x + sl.x, z = W.z + sl.z, s = sl.s;
      let build = MODELS[it.model];
      if (!build){ console.warn(`找不到模型「${it.model}」，先用小屋代替`); build = MODELS.house; }
      const yaw = (k === 0 || SYMBOLS.has(it.model)) ? 0 : (rr() - 0.5) * 0.35;
      const base = new THREE.Matrix4().compose(new THREE.Vector3(x, TOP, z), new THREE.Quaternion().setFromAxisAngle(up, yaw), new THREE.Vector3(s, s, s));
      const h = build(new ModelCtx(kit, it.id, base), rngFor(it.id));
      itemRoot.index.set(it.id, { island: i, x, z, s, top: TOP + h * s });
    });
    itemRoot.trees[i] = placeDecor(kit, small, i, slots);
  });
  itemRoot.built = kit.build(itemRoot.group);
  itemRoot.small = small.build(itemRoot.group, { cast: false });
  for (const m of [...itemRoot.built.meshes, ...itemRoot.small.meshes]) m.frustumCulled = false;
  applyLOD(true);
}

/* 目前時段亮起的細項：往黃色混 22% */

  const seg = currentSeg(), lit = new Set(seg ? seg.items : []);

/* 換地圖時，細項從地面長出來 */
const pop = { t: 1 };
function startPop(){ pop.t = reduced ? 1 : 0; applyPop(reduced ? 1 : 0.001); }
function applyPop(f){ itemRoot.group.scale.set(1, Math.max(0.001, f), 1); itemRoot.group.position.y = TOP * (1 - f); }
function updatePop(dt){
  if (pop.t >= 1) return false;
  pop.t = Math.min(1, pop.t + dt / 0.55);
  applyPop(easeOutBack(pop.t));
  return true;
}

/* ── 編號 pin：選島後每個細項上方一顆，coral 細線（depthTest false）連到模型頂端 ── */
const pins = { list: [], line: null, island: -1 };
function buildPins(i){
  for (const P of pins.list) scene.remove(P.obj);              // CSS2DObject 移除時會自動拿掉 DOM
  if (pins.line){ scene.remove(pins.line); pins.line.geometry.dispose(); pins.line = null; }
  pins.list = []; pins.island = i;

    el.addEventListener('click', () => selectItem(it.id));
    const obj = new CSS2DObject(el);
    obj.position.set(ix.x, ix.top + rise + 0.05, ix.z);
    scene.add(obj);
    pts.push(ix.x, ix.top + 0.02, ix.z, ix.x, ix.top + rise, ix.z);
    pins.list.push({ el, obj, id: it.id, mode: 2, pri: 3, wFull: size + 6, wNo: 0, h: size + 6, sx: 0, sy: 0, sz: 0 });
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  pins.line = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: PAL.coral, depthTest: false, transparent: true, opacity: 0.9 }));
  pins.line.renderOrder = 20; pins.line.frustumCulled = false;

/* 介面面板佔住的螢幕範圍：標籤不擺在面板底下（每 250ms 量一次；開關面板時 uiBlockStale() 立刻重量） */
const UI_BLOCK = { t: -1e9, rects: [] };
const UI_BLOCK_SEL = '.brand,.tools,#card,#side,#hud,#legend,#present-bar,#log,#btn-time';
function uiBlockStale(){ UI_BLOCK.t = -1e9; }
function uiBlockRects(){
  const now = performance.now();
  if (now - UI_BLOCK.t > 250){
    UI_BLOCK.t = now;
    UI_BLOCK.rects = [...document.querySelectorAll(UI_BLOCK_SEL)].map(e => e.getBoundingClientRect())
      .filter(r => r.width > 0 && r.height > 0).map(r => [r.left, r.top, r.right, r.bottom]);
  }
  return UI_BLOCK.rects;
}
function layoutLabels(){
  const W = glEl.clientWidth, H = glEl.clientHeight, v = new THREE.Vector3();
  const all = labels.concat(pins.list, TAGS.pool.filter(t => t.obj.visible));   // 名牌氣泡優先度最低，擠不下就先藏
  for (const L of all){ v.copy(L.obj.position).project(camera); L.sx = (v.x * 0.5 + 0.5) * W; L.sy = (-v.y * 0.5 + 0.5) * H; L.sz = v.z; }
  const order = all.sort((a, b) => (b.pri - a.pri) || (a.sz - b.sz));   // pin 最優先，其次選取的島，再來離相機近的
  const placed = uiBlockRects().slice();
  for (const L of order){
    let mode = 0, shift = 0;
    if (L.sz < 1 && L.sx > -60 && L.sx < W + 60 && L.sy > -40 && L.sy < H + 40){
      for (const cand of (L.wNo ? [2, 1] : [2])){
        const w = cand === 2 ? L.wFull : L.wNo, h = L.h;
        const dx = L.edge ? clamp(L.sx, w / 2 + 6, W - w / 2 - 6) - L.sx : 0;   // 島名標籤貼到畫面邊緣時往內推
        const x = L.sx + dx, m = L.mode >= cand ? -4 : 4;        // 8px hysteresis：維持現狀較寬鬆、升級較嚴格
        const r0 = x - w / 2 - m, r1 = L.sy - h / 2 - m, r2 = x + w / 2 + m, r3 = L.sy + h / 2 + m;
        if (!placed.some(p => r0 < p[2] && r2 > p[0] && r1 < p[3] && r3 > p[1])){
          mode = cand; shift = Math.round(dx); placed.push([x - w / 2, L.sy - h / 2, x + w / 2, L.sy + h / 2]); break;
        }
      }
    }
    if (mode !== L.mode){
      L.mode = mode;
      L.el.classList.toggle('compact', mode === 1);
      L.el.classList.toggle('off', mode === 0);
    }
    if (L.edge && shift !== L.dx){ L.dx = shift; L.el.style.translate = shift ? `${shift}px 0` : ''; }
  }
}

    if (a <= b ? (m >= a && m < b) : (m >= a || m < b)) return s;
  }
  return null;
}

/* ── 手機底部面板：拖曳把手調整高度，放開時吸附到預設／六成／全螢幕，拉太低就收起 ── */
function sheetSize(el, f){ el.classList.toggle('full', f >= 0.99); el.style.height = Math.round(Math.min(1, f) * innerHeight) + 'px'; }
function sheetReset(el){ el.classList.remove('full'); el.style.height = ''; }
function initSheets(){
  const setup = (el, def, close) => {
    const grab = el.querySelector('.grab');
    let y0 = 0, h0 = 0, drag = false, moved = false;
    const toggle = () => sheetSize(el, el.classList.contains('full') ? def : 1);
    grab.addEventListener('pointerdown', e => {
      if (!isMobile()) return;
      drag = true; moved = false; y0 = e.clientY; h0 = el.getBoundingClientRect().height;
      grab.setPointerCapture(e.pointerId); el.style.transition = 'none'; e.preventDefault();
    });
    grab.addEventListener('pointermove', e => {
      if (!drag) return;
      if (Math.abs(e.clientY - y0) > 5) moved = true;
      el.style.height = clamp(h0 + y0 - e.clientY, 60, innerHeight) + 'px';
    });
    const end = () => {
      if (!drag) return;
      drag = false; el.style.transition = '';
      if (!moved) return toggle();                                  // 只是點一下：切換大小
      const f = el.getBoundingClientRect().height / innerHeight;
      if (f < 0.18){ sheetReset(el); return close(); }
      sheetSize(el, [def, 0.62, 1].reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a));
    };
    grab.addEventListener('pointerup', end);
    grab.addEventListener('pointercancel', end);
    grab.addEventListener('click', e => { if (e.detail === 0) toggle(); });   // 鍵盤操作
  };
  setup(cardEl, 0.34, userCloseCard);
  setup(sideEl, 0.52, () => setSide(false));
}

function onDataClick(e){
  const t = e.target.closest('[data-item],[data-island],[data-flow],[data-map],[data-tour]');
  if (!t) return;
  const d = t.dataset, fromSide = !!t.closest('#side');
  if (fromSide && isMobile()) setSide(false, false);               // 手機一次只開一個底部面板
  if (d.item) selectItem(d.item);
  else if (d.island !== undefined) selectIsland(Number(d.island));
  else if (d.flow) selectFlow(d.flow);
  else if (d.map){                                                 // data-goto：換地圖後直接選那座島
    const go = d.goto !== undefined;
    if (state.mapId !== d.map) applyMap(d.map, { flyHome: !go });
    if (go) selectIsland(Number(d.goto));
  }
  else if (d.tour === 'restart') startTour(0);
}

function showCard(html){

/* ── 細項卡的 160² 模型縮圖：用一個小的離屏渲染器拍一張 ── */
let thumbR = null, thumbScene = null, thumbCam = null;
const thumbCache = new Map();
function makeThumb(it){
  if (thumbCache.has(it.id)) return thumbCache.get(it.id);
  let url = null;
  try {
    if (!thumbR){
      thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      thumbR.setPixelRatio(2); thumbR.setSize(160, 160, false);
      thumbR.outputColorSpace = THREE.SRGBColorSpace; thumbR.toneMapping = THREE.ACESFilmicToneMapping;
      thumbScene = new THREE.Scene();
      thumbScene.add(new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.6));
      const d = new THREE.DirectionalLight(0xfff1de, 2.6); d.position.set(2, 4, 3); thumbScene.add(d);
      thumbCam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    }
    const g = new THREE.Group(); thumbScene.add(g);
    const kit = new Kit('thumb-' + it.id);
    const h = (MODELS[it.model] || MODELS.house)(new ModelCtx(kit, null, new THREE.Matrix4()), rngFor(it.id));
    const built = kit.build(g, { cast: false, receive: false });
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.05, 32), new THREE.MeshStandardMaterial({ color: '#efe4d6', roughness: 0.9 }));
    disc.position.y = -0.025; g.add(disc);
    const cy = Math.max(h, 0.5) * 0.42, dist = (1.75 + h) / 1.1;
    thumbCam.position.set(dist * 0.45, cy + dist * 0.55, dist * 0.85); thumbCam.lookAt(0, cy, 0);
    const ge = MAT.glow.emissiveIntensity, pv = MAT.pool.visible;
    MAT.glow.emissiveIntensity = 0; MAT.pool.visible = false;      // 縮圖一律用白天的樣子
    thumbR.render(thumbScene, thumbCam);
    MAT.glow.emissiveIntensity = ge; MAT.pool.visible = pv;
    url = thumbR.domElement.toDataURL('image/png');
    built.dispose(); thumbScene.remove(g); disc.geometry.dispose(); disc.material.dispose();
  } catch (err){ console.warn('縮圖產生失敗，改用圖示', err); }
  thumbCache.set(it.id, url);
  return url;
}

/* =====================================================================
 * 10f. 點選 3D 物件（pointerup 且移動 ≤ 6px 才 raycast）、鍵盤、操作說明
 * ===================================================================== */
function islandAt(x, z){
  let best = -1, bd = Infinity;
  ISL.forEach((W, i) => { const d = hexDist(x - W.x, z - W.z); if (d < bd){ bd = d; best = i; } });
  return bd <= R * HEX_IN + 0.08 ? best : -1;
}
function initPicking(){
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), el = renderer.domElement;
  let down = null;
  el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 6) return;
    const wi = pickWalkerAt(e.clientX, e.clientY);              // 先看有沒有點到小人
    if (wi >= 0) return selectWalker(wi);
    const r = el.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const targets = [...extraPickTargets, ...itemRoot.built.meshes.filter(m => m.material !== MAT.pool), ...islandGroup.tops, islandGroup.body];
    for (const h of ray.intersectObjects(targets, false)){
      const u = h.object.userData;
      if (u.pickFlow){ const id = u.pickFlow(h); if (id) return selectWalker(id); continue; }   // Step 5：小人
      const owner = u.owners && u.owners[h.instanceId];
      if (owner) return selectItem(owner);
      const i = islandAt(h.point.x, h.point.z);
      if (i >= 0) return selectIsland(i);
    }
    if (state.cardOpen) clearSelection();                         // 點到水面：收起卡片
  });
}
function onKey(e){
  const tag = (e.target && e.target.tagName || '').toLowerCase(), k = e.key;
  if (tag === 'input' || tag === 'textarea'){ if (k === 'Escape') e.target.blur(); return; }
  if (!$('#guide').hidden){ if (k === 'Escape'){ e.preventDefault(); closeGuide(); } return; }
  if (k === 'Escape'){ if (state.cardOpen) userCloseCard(); else if (state.present) setPresent(false); return; }
  if (state.present){                                            // 簡報模式：← → 切島、空白鍵暫停（簡報筆的翻頁鍵也可以）
    if (k === 'ArrowRight' || k === 'PageDown'){ e.preventDefault(); gotoTour(tour.idx + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); gotoTour(tour.idx - 1); }
    else if (k === ' '){ e.preventDefault(); toggleTourPause(); }
    return;
  }
  if (k === 'ArrowLeft'){ e.preventDefault(); nudgeCamera(-0.2, 0); }  // 一般模式：方向鍵轉動鏡頭
  else if (k === 'ArrowRight'){ e.preventDefault(); nudgeCamera(0.2, 0); }
  else if (k === 'ArrowUp'){ e.preventDefault(); nudgeCamera(0, -0.1); }
  else if (k === 'ArrowDown'){ e.preventDefault(); nudgeCamera(0, 0.1); }
}
function openGuide(more){

/* =====================================================================
 * 12. 小人與協作線
 *    每條協作線依路網 Dijkstra 算路線；4–14 人在兩端來回，到站停 1.4 秒交接再折返。
 *    協作線沿同一條路線做成 TubeGeometry，shader 畫出實線／虛線／點線並讓圖樣流動。
 * ===================================================================== */
const FLOW = { group: null, lines: [], paths: [], walkers: [], parts: {}, time: { value: 0 }, thick: { value: 1 }, far: false, clock: 0, ring: null, onArrive: null };
const LANES = [0, 0.035, -0.035, 0.06, -0.06];                 // 不同協作線錯開車道，重疊路段才分得清楚
const LEVEL_MODE = { solid: 0, dashed: 1, dotted: 2 };

const FLOW_VS = /* glsl */`
  uniform float uThick, uPad;
  varying vec2 vUv; varying vec3 vN;
  #include <common>
  #include <fog_pars_vertex>
  void main(){
    vUv = uv; vN = normalize(mat3(modelMatrix) * normal);
    float grow = 0.035 * (uThick - 1.0);                          // 拉遠時線變粗（近看維持半徑 .035），並抬高免得陷進地面
    vec3 p = position + normal * (grow + uPad * uThick) + vec3(0.0, grow, 0.0);   // uPad：白色外框再往外撐
    vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const FLOW_FS = /* glsl */`
  uniform float uTime, uLen, uMode, uOpacity, uThick;
  uniform vec3 uColor;
  varying vec2 vUv; varying vec3 vN;
  #include <common>
  #include <fog_pars_fragment>
  void main(){
    float u = vUv.x * uLen * 5.0 / uThick - uTime * 1.4;          // u = 長度方向 × 5 − 時間 × 1.4（拉遠時圖樣跟著放大）
    if (uMode > 0.5 && uMode < 1.5 && fract(u) > 0.6) discard;     // 虛線
    if (uMode > 1.5 && fract(u) > 0.3) discard;                    // 點線
    float shade = 0.78 + 0.22 * max(vN.y, 0.0);
    float glint = smoothstep(0.8, 1.0, fract(u * 0.2)) * 0.3;     // 沿線流動的亮帶（實線也看得出方向）
    gl_FragColor = vec4(uColor * shade + glint, uOpacity);
    #include <colorspace_fragment>
    #include <fog_fragment>
  }`;
/* 遠看時的白色外框：和屋頂、欄杆的珊瑚色分得開，實線／虛線／點線也看得出差別 */
const FLOW_HALO_FS = /* glsl */`
  uniform float uOpacity;
  void main(){
    gl_FragColor = vec4(1.0, 0.98, 0.95, uOpacity);
    #include <colorspace_fragment>
  }`;

/* ── 路線：節點序列 → 加密的折線（橋上依拱形起伏）＋斜接法線＋累積長度 ── */
function buildPath(ids){
  const pts = [];
  const push = (x, y, z) => { const l = pts[pts.length - 1]; if (!l || Math.hypot(l.x - x, l.z - z) > 1e-4) pts.push({ x, y, z, nx: 0, nz: 0 }); };
  ids.forEach((id, k) => {
    const n = NET.nodes[id];
    if (k > 0){
      const A = NET.nodes[ids[k - 1]], e = NET.adj[ids[k - 1]].find(q => q.to === id);
      if (e && e.bridge >= 0){
        const h = NET.bridges[e.bridge].h;
        for (let s = 1; s < 8; s++){ const t = s / 8; push(A.x + (n.x - A.x) * t, WALK_Y + 0.024 + h * Math.sin(Math.PI * t), A.z + (n.z - A.z) * t); }
      }
    }
    push(n.x, WALK_Y + 0.004, n.z);
  });
  const N = pts.length;
  for (let i = 0; i < N; i++){                                  // 轉角用斜接法線，車道偏移才不會變窄
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)], p = pts[i];
    let d1x = p.x - a.x, d1z = p.z - a.z, d2x = b.x - p.x, d2z = b.z - p.z;
    const l1 = Math.hypot(d1x, d1z) || 1, l2 = Math.hypot(d2x, d2z) || 1;
    d1x /= l1; d1z /= l1; d2x /= l2; d2z /= l2;
    if (i === 0){ d1x = d2x; d1z = d2z; }
    if (i === N - 1){ d2x = d1x; d2z = d1z; }
    let tx = d1x + d2x, tz = d1z + d2z; const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
    const miter = 1 / Math.max(0.5, tx * d2x + tz * d2z);
    p.nx = -tz * miter; p.nz = tx * miter;                      // 指向行進方向的右側
  }
  const cum = [0];
  for (let i = 1; i < N; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y, pts[i].z - pts[i - 1].z));
  return { pts, cum, len: cum[N - 1] };
}
function samplePath(path, s, hint){
  const { pts, cum } = path;
  let i = clamp(hint | 0, 0, pts.length - 2);
  while (i < pts.length - 2 && cum[i + 1] < s) i++;
  while (i > 0 && cum[i] > s) i--;
  const t = clamp((s - cum[i]) / ((cum[i + 1] - cum[i]) || 1), 0, 1);
  return { i, t, a: pts[i], b: pts[i + 1] };
}

/* 每座島依序把「前側」節點分給協作線當端點，大家不會擠在同一點 */
function flowEndpoints(map){
  const pref = [3, 1, 5, 2, 4, 0, 6], used = new Map();
  return map.flows.map(f => {
    const a = islIndex(f.from), b = islIndex(f.to), ka = used.get(a) || 0, kb = used.get(b) || 0;
    used.set(a, ka + 1); used.set(b, kb + 1);
    return [a * 12 + pref[ka % pref.length], b * 12 + pref[kb % pref.length]];
  });
}

function disposeFlows(){
  for (const L of FLOW.lines){ FLOW.group.remove(L.mesh, L.halo); L.mesh.geometry.dispose(); L.mesh.material.dispose(); L.halo.material.dispose(); }
  for (const m of Object.values(FLOW.parts)){ FLOW.group.remove(m); m.dispose(); }
  if (BADGE.mesh){ FLOW.group.remove(BADGE.mesh); BADGE.mesh.geometry.dispose(); BADGE.mesh.dispose(); BADGE.mesh = null; }
  FLOW.lines = []; FLOW.paths = []; FLOW.walkers = []; FLOW.parts = {};
}

/* ── 加分：頭上 badge（白色對話泡泡＋墨色線條的搬運物圖示），鏡頭距離 < 16 才顯示 ──

const BADGE = { atlas: null, mat: null, mesh: null };
const BADGE_VS = /* glsl */`
  attribute float aIcon;
  varying vec2 vUv;
  void main(){
    vec4 c = modelViewMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    c.xy += position.xy * length(instanceMatrix[0].xyz);           // 永遠面向鏡頭
    vUv = vec2((uv.x + aIcon) / 8.0, uv.y);

const BADGE_FS = /* glsl */`
  uniform sampler2D uMap;
  varying vec2 vUv;
  void main(){
    vec4 t = texture2D(uMap, vUv);
    if (t.a < 0.5) discard;
    gl_FragColor = vec4(t.rgb, 1.0);

  }`;

function initBadges(){
  const order = Object.keys(DATA.cargo).slice(0, 8), S = 128, c = document.createElement('canvas');
  c.width = S * 8; c.height = S;

function buildBadges(map){

function buildFlows(map){
  if (!WGEO) initWalkerGeo();
  disposeFlows();
  const rr = rngFor('walkers-' + map.id), coral = new THREE.Color(PAL.coral);
  flowEndpoints(map).forEach(([na, nb], fi) => {
    const f = map.flows[fi], lane = LANES[fi % LANES.length], path = buildPath(dijkstra(na, nb));
    path.lane = lane; FLOW.paths.push(path);
    /* 協作線：TubeGeometry（半徑 .035），預設隱藏 */
    const curve = new THREE.CatmullRomCurve3(path.pts.map(p => new THREE.Vector3(p.x + p.nx * lane, p.y + 0.022, p.z + p.nz * lane)), false, 'centripetal');
    const len = curve.getLength();
    const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog]);
    Object.assign(u, { uTime: FLOW.time, uThick: FLOW.thick, uPad: { value: 0 }, uLen: { value: len }, uMode: { value: LEVEL_MODE[f.level] || 0 }, uOpacity: { value: 0.82 }, uColor: { value: coral.clone() } });
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(24, Math.ceil(len * 14)), 0.035, 6, false),
      new THREE.ShaderMaterial({ uniforms: u, vertexShader: FLOW_VS, fragmentShader: FLOW_FS, transparent: true, depthWrite: false, fog: true, toneMapped: false,
        polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -12 }));     // 步道有往前推的深度偏移，線要推得更前面才不會被蓋住
    mesh.visible = false; mesh.renderOrder = 5;
    const halo = new THREE.Mesh(mesh.geometry, new THREE.ShaderMaterial({ vertexShader: FLOW_VS, fragmentShader: FLOW_HALO_FS, transparent: true, depthWrite: false,
      uniforms: { uThick: FLOW.thick, uPad: { value: 0.018 }, uOpacity: { value: 0.9 } } }));
    halo.visible = false; halo.renderOrder = 4;
    FLOW.group.add(halo, mesh);
    FLOW.lines.push({ id: f.id, mesh, halo });
    /* 小人：依角色配件，在兩端來回 */
    for (let k = 0; k < f.count; k++){
      const role = f.roles[k % f.roles.length], bike = role === 'cyclist';
      FLOW.walkers.push({
        i: FLOW.walkers.length, flow: fi, flowId: f.id, role, bike,
        s: rr() * path.len, dir: rr() < 0.5 ? 1 : -1, wait: 0, seg: 0, phase: rr(),
        speed: bike ? 0.62 + rr() * 0.08 : role === 'elder' ? 0.32 + rr() * 0.02 : 0.32 + rr() * 0.08,
        side: 0.012 + rr() * 0.012, lat: lane, heading: null, x: 0, y: 0, z: 0, sc: 1, fade: 1,
        shirt: role === 'lecturer' ? '#2f4b55' : role === 'advisor' ? C.blue : role === 'officer' ? '#e8eef0' : role === 'student' ? '#f4f1ea' : role === 'elder' ? '#a58b7a' : pick(rr, SHIRTS),
        skin: pick(rr, SKINS), hair: role === 'elder' ? '#d9d4cc' : pick(rr, HAIRS), pants: pick(rr, PANTS),
        acc: role === 'learner' ? pick(rr, [C.roof, C.teal, C.blue, C.yellow]) : role === 'officer' ? C.roof : role === 'student' ? '#f4c542' : role === 'cyclist' ? pick(rr, [C.roof, C.teal]) : role === 'advisor' ? '#2f3a40' : C.woodD,
        ix: {},
      });
