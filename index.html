    counts.leg += 2; counts.arm += 2; counts.eye += 2; counts.body++; counts.head++; counts.hair++; counts.shadow++;
    for (const a of new Set(ROLE_ACC[w.role] || [])){ w.ix[a] = counts[a] || 0; counts[a] = (counts[a] || 0) + ROLE_ACC[w.role].filter(x => x === a).length; }
  }
  for (const [kind, n] of Object.entries(counts)){
    if (!n) continue;
    const m = new THREE.InstancedMesh(WGEO[kind], kind === 'shadow' ? SHADOW_MAT : MAT.solid, n);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.frustumCulled = false; m.castShadow = false; m.receiveShadow = kind !== 'shadow';
    FLOW.group.add(m); FLOW.parts[kind] = m;
  }
  const col = (kind, idx, c) => FLOW.parts[kind].setColorAt(idx, new THREE.Color(c));
  for (const w of FLOW.walkers){
    for (let s = 0; s < 2; s++){ col('leg', w.ix.leg + s, w.pants); col('arm', w.ix.arm + s, w.shirt); col('eye', w.ix.eye + s, C.ink); }
    col('body', w.i, w.shirt); col('head', w.i, w.skin); col('hair', w.i, w.hair);
    for (const a of ROLE_ACC[w.role] || []){
      const n = ROLE_ACC[w.role].filter(x => x === a).length;
      for (let s = 0; s < n; s++) col(a, w.ix[a] + s, a === 'badge' ? C.cream : a === 'wheel' ? '#2f3a40' : a === 'stick' ? C.ink : w.acc);
    }
  }
  for (const [kind, m] of Object.entries(FLOW.parts)) if (m.instanceColor && kind !== 'shadow') m.instanceColor.needsUpdate = true;
  buildBadges(map);
  updateWalkers(0);
  refreshFlows();
}

/* ── 每幀更新小人：ph = time·9 + phase·20；腿擺 ±.55、手擺 ±.45、起伏 |sin ph|·.012 ── */
let _wA, _wB, _wC, _wL, _wq, _we, _wp, _ws, _wcam, _wT, _wD, _wE;   // 暫存物件：three.js 載入後才建立（見 initWalkerGeo）
function WL(x, y, z, rx = 0, ry = 0, sx = 1, sy = 1, sz = 1){ _we.set(rx, ry, 0); _wq.setFromEuler(_we); _wp.set(x, y, z); _ws.set(sx, sy, sz); return _wL.compose(_wp, _wq, _ws); }
function wput(kind, idx, local){ _wB.multiplyMatrices(_wA, local); FLOW.parts[kind].setMatrixAt(idx, _wB); }

function updateWalkers(dt){
  if (!FLOW.walkers.length) return;
  camera.getWorldPosition(_wcam);
  const selW = state.sel && state.sel.walker !== undefined ? state.sel.walker : -1;
  const badges = BADGE.mesh && camera.position.distanceTo(controls.target) < 16;   // badge：鏡頭距離 < 16 才顯示
  if (BADGE.mesh) BADGE.mesh.visible = !!badges;
  /* 看建物時：比建物離鏡頭近、在螢幕上又疊在建物上的小人，先縮小讓開 */
  const selIx = state.sel && state.sel.type === 'item' ? itemRoot.index.get(state.sel.id) : null;
  let tDist = 0, tR = 0;
  if (selIx){
    _wT.set(selIx.x, (TOP + selIx.top) / 2, selIx.z); tDist = _wT.distanceTo(_wcam);
    tR = 0.6 / (tDist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));   // 建物半徑約 0.6 → 螢幕上的半徑（NDC）
    _wD.copy(_wT).project(camera);
  }
  for (const w of FLOW.walkers){
    const path = FLOW.paths[w.flow];
    if (dt > 0){
      if (w.wait > 0){
        w.wait -= dt;
        if (w.wait <= 0){ w.dir = -w.dir; if (FLOW.onDepart) FLOW.onDepart(w, w.dir > 0 ? 'from' : 'to'); }   // 交接完：出發
      }
      else {
        w.s += w.dir * w.speed * dt;
        if (w.s >= path.len){ w.s = path.len; w.wait = 1.4; if (FLOW.onArrive) FLOW.onArrive(w, 'to'); }     // 到站：停 1.4 秒交接
        else if (w.s <= 0){ w.s = 0; w.wait = 1.4; if (FLOW.onArrive) FLOW.onArrive(w, 'from'); }
      }
    }
    const sp = samplePath(path, w.s, w.seg); w.seg = sp.i;
    const { a, b, t } = sp;
    const latGoal = path.lane + w.dir * w.side;                    // 對向的人分走線的兩側
    w.lat = dt > 0 ? w.lat + (latGoal - w.lat) * Math.min(1, dt * 3) : latGoal;
    const nx = a.nx + (b.nx - a.nx) * t, nz = a.nz + (b.nz - a.nz) * t;
    const x = a.x + (b.x - a.x) * t + nx * w.lat, y = a.y + (b.y - a.y) * t, z = a.z + (b.z - a.z) * t + nz * w.lat;
    const dirSign = w.wait > 0 ? -w.dir : w.dir;                   // 交接時慢慢轉身
    const goal = Math.atan2((b.x - a.x) * dirSign, (b.z - a.z) * dirSign);
    if (w.heading === null || dt === 0 && w.heading === null) w.heading = goal;
    else { const dh = Math.atan2(Math.sin(goal - w.heading), Math.cos(goal - w.heading)); w.heading += dh * (dt > 0 ? Math.min(1, dt * (w.wait > 0 ? 3 : 8)) : 0); }
    const moving = w.wait <= 0;
    const ph = moving ? FLOW.clock * 9 * (w.bike ? 1.3 : 1) + w.phase * 20 : 0;
    const sw = Math.sin(ph), bob = moving && !w.bike ? Math.abs(sw) * 0.012 : 0;
    const sc = clamp(Math.hypot(_wcam.x - x, _wcam.y - y, _wcam.z - z) / 20, 1, 1.45);   // 拉遠時放大，遠看也找得到
    w.x = x; w.y = y; w.z = z; w.sc = sc;
    let show = 1;
    if (selIx){                                                    // 走過去、不再擋住就長回來
      _wE.set(x, y + 0.18, z);
      if (_wE.distanceTo(_wcam) < tDist - 0.4){
        _wE.project(camera);
        if (Math.hypot((_wE.x - _wD.x) * camera.aspect, _wE.y - _wD.y) < tR) show = 0;
      }
    }
    w.fade = dt > 0 ? w.fade + (show - w.fade) * Math.min(1, dt * 6) : show;
    const vs = sc * Math.max(0.001, w.fade);
    _we.set(0, w.heading, 0); _wq.setFromEuler(_we); _wp.set(x, y + bob, z); _ws.set(vs, vs, vs);
    _wA.compose(_wp, _wq, _ws);
    const lift = w.bike ? 0.07 : 0, fz = w.bike ? 0.02 : 0;
    const legL = w.bike ? sw * 0.7 - 0.6 : sw * 0.55, legR = w.bike ? -sw * 0.7 - 0.6 : -sw * 0.55;
    wput('leg', w.ix.leg, WL(-0.028, 0.1 + lift, 0, legL));
    wput('leg', w.ix.leg + 1, WL(0.028, 0.1 + lift, 0, legR));
    wput('body', w.i, WL(0, 0.18 + lift, 0, w.bike ? 0.25 : 0));
    wput('head', w.i, WL(0, 0.3 + lift, fz));
    wput('hair', w.i, WL(0, 0.303 + lift, fz - 0.004, -0.15));
    wput('eye', w.ix.eye, WL(-0.025, 0.305 + lift, fz + 0.064));
    wput('eye', w.ix.eye + 1, WL(0.025, 0.305 + lift, fz + 0.064));
    const armL = w.bike ? -1.25 : w.role === 'advisor' ? -1.1 : -sw * 0.45;
    const armR = w.bike ? -1.25 : w.role === 'advisor' ? -1.1 : sw * 0.45;
    wput('arm', w.ix.arm, WL(-0.07, 0.245 + lift, 0, armL));
    wput('arm', w.ix.arm + 1, WL(0.07, 0.245 + lift, 0, armR));
    wput('shadow', w.i, WL(0, 0.004 - bob / sc, 0, 0, 0, 1, 1, w.bike ? 1.8 : 1));
    switch (w.role){
      case 'learner':  wput('pack', w.ix.pack, WL(0, 0.19, -0.068)); break;
      case 'lecturer': _wC.copy(WL(0.07, 0.245, 0, armR)).multiply(WL(0, -0.09, 0, -1.3)); wput('stick', w.ix.stick, _wC); break;
      case 'advisor':  wput('tablet', w.ix.tablet, WL(0, 0.2, 0.09, -0.6)); break;
      case 'officer':  wput('vest', w.ix.vest, WL(0, 0.19, 0)); wput('badge', w.ix.badge, WL(0.026, 0.205, 0.061)); break;
      case 'student':  wput('hat', w.ix.hat, WL(0, 0.303, 0)); wput('brim', w.ix.brim, WL(0, 0.31, 0.04, 0.12)); break;
      case 'elder':    wput('cane', w.ix.cane, WL(0.09, 0, 0.05, -0.15 + sw * 0.1)); break;
      case 'cyclist':
        wput('wheel', w.ix.wheel, WL(0, 0.07, -0.11, 0, Math.PI / 2));
        wput('wheel', w.ix.wheel + 1, WL(0, 0.07, 0.11, 0, Math.PI / 2));
        wput('frame', w.ix.frame, WL(0, 0.15, 0, 0, 0, 1, 1, 0.2));
        wput('frame', w.ix.frame + 1, WL(0, 0.12, -0.025, -0.53, 0, 1, 1, 0.2));
        wput('frame', w.ix.frame + 2, WL(0, 0.21, 0.08, 0, Math.PI / 2, 1, 1, 0.12));
        break;
    }
    if (w.i === selW && FLOW.ring){ FLOW.ring.position.set(x, y + 0.008, z); FLOW.ring.scale.setScalar(sc); }
    if (badges){
      const bs = 0.14 * vs;
      _wq.identity(); _wp.set(x, y + bob + (0.47 + lift) * vs, z); _ws.set(bs, bs, bs);
      BADGE.mesh.setMatrixAt(w.i, _wB.compose(_wp, _wq, _ws));
    }
  }
  for (const m of Object.values(FLOW.parts)) m.instanceMatrix.needsUpdate = true;
  if (badges) BADGE.mesh.instanceMatrix.needsUpdate = true;
  if (FLOW.ring) FLOW.ring.visible = selW >= 0;
}

/* 點小人：在螢幕上找最近的一位（拉近時才開放，避免全景點島時誤觸） */
function pickWalkerAt(cx, cy){
  if (!FLOW.walkers.length || camera.position.distanceTo(controls.target) > 20) return -1;
  const r = renderer.domElement.getBoundingClientRect(), v = new THREE.Vector3();
  let best = -1, bd = matchMedia('(pointer: coarse)').matches ? 24 : 15;
  for (const w of FLOW.walkers){
    if (w.fade < 0.5) continue;                                    // 讓開視線、縮小中的小人點不到
    v.set(w.x, w.y + 0.2 * w.sc, w.z).project(camera);
    if (v.z > 1) continue;
    const d = Math.hypot(r.left + (v.x * 0.5 + 0.5) * r.width - cx, r.top + (-v.y * 0.5 + 0.5) * r.height - cy);
    if (d < bd){ bd = d; best = w.i; }
  }
  return best;
}

/* =====================================================================
 * 13. 加分：名牌氣泡、城市日誌
 * ===================================================================== */
/* ── 名牌：近距離（< 14）小人頭上顯示「正在送 X」，最多同時 10 個，參與標籤避讓 ── */
const TAGS = { on: false, pool: [] };
function initTags(){
  for (let k = 0; k < 10; k++){
    const el = document.createElement('div'); el.className = 'tag';
    const obj = new CSS2DObject(el); obj.visible = false; scene.add(obj);
    TAGS.pool.push({ el, obj, mode: 2, pri: -1, wFull: 90, wNo: 0, h: 26, sx: 0, sy: 0, sz: 0, text: '' });
  }
}
function updateTags(){
  if (!TAGS.on || !FLOW.walkers.length){ for (const t of TAGS.pool) t.obj.visible = false; return; }
  const cam = camera.position, v = TAGS.v || (TAGS.v = new THREE.Vector3());
  const onScreen = w => { v.set(w.x, w.y + 0.6 * w.sc, w.z).project(camera); return v.z < 1 && Math.abs(v.x) < 0.95 && Math.abs(v.y) < 0.9; };
  const near = FLOW.walkers.map(w => ({ w, d: Math.hypot(w.x - cam.x, w.y - cam.y, w.z - cam.z) }))
    .filter(o => o.d < 14 && o.w.fade > 0.5 && onScreen(o.w)).sort((a, b) => a.d - b.d).slice(0, TAGS.pool.length);   // 只挑畫面裡看得到的（讓開視線的不算）
  TAGS.pool.forEach((t, k) => {
    const o = near[k];
    if (!o){ t.obj.visible = false; return; }
    const w = o.w, cg = DATA.cargo[state.map.flows[w.flow].cargo];
    const text = w.wait > 0 ? `交接 ${cg.icon}${cg.label}` : `正在送 ${cg.icon}${cg.label}`;
    if (text !== t.text){ t.text = text; t.el.textContent = text; t.wFull = [...text].length * 12 + 26; }
    t.obj.position.set(w.x, w.y + ((w.bike ? 0.07 : 0) + 0.68) * w.sc, w.z);
    t.obj.visible = true;
  });
}

/* ── 城市日誌：小人到站產生出發／抵達／交接事件，「即時」綠點，可依協作線篩選 ── */
const LOG = { open: false, items: [], filter: 'all', dirty: false, last: 0 };
FLOW.onArrive = (w, end) => logEvent('arrive', w, end);
FLOW.onDepart = (w, end) => logEvent('depart', w, end);
function logEvent(type, w, end){
  LOG.items.unshift({ type, wi: w.i, flow: w.flow, flowId: w.flowId, end, min: clock.min, role: w.role, bike: w.bike });
  if (LOG.items.length > 80) LOG.items.length = 80;
  LOG.dirty = true;
}
function resetLog(map){
  LOG.items = []; LOG.filter = 'all'; LOG.dirty = true;
  $('#log-filter').innerHTML = `<option value="all">全部${esc(map.flowTitle)}</option>` + map.flows.map(f => {
    const A = map.islands[islIndex(f.from)], B = map.islands[islIndex(f.to)];
    return `<option value="${f.id}">${esc(A.no)} ${esc(A.name)} → ${esc(B.no)} ${esc(B.name)}</option>`;
  }).join('');
}
function renderLog(){
  if (!LOG.open) return;
  const map = state.map;
  const list = LOG.items.filter(e => LOG.filter === 'all' || e.flowId === LOG.filter).slice(0, 30);
  $('#log-list').innerHTML = list.length ? list.map(e => {
    const f = map.flows[e.flow], A = map.islands[islIndex(f.from)], B = map.islands[islIndex(f.to)], cg = DATA.cargo[f.cargo], who = DATA.roles[e.role].label;
    const at = e.end === 'to' ? B : A, other = e.end === 'to' ? A : B;
    const txt = e.type === 'arrive'
      ? `🤝 ${who}抵達 ${at.no} ${at.name}，交接${cg.icon}${cg.label}`
      : `${e.bike ? '🚲' : '🚶'} ${who}從 ${at.no} ${at.name} 出發，把${cg.icon}${cg.label}送往 ${other.no} ${other.name}`;
    return `<li><button type="button" data-walker="${e.wi}" title="點一下看這位的協作線"><time>${fmtTime(e.min)}</time><span>${esc(txt)}</span></button></li>`;
  }).join('') : '<p class="empty">還沒有新動態。小人走到站時，這裡就會出現紀錄。</p>';
  LOG.dirty = false;
}
function updateLogLive(){
  const live = clock.running && !reduced;
  $('#log-live').classList.toggle('off', !live);
  $('#log-live-tx').textContent = live ? '即時' : '已暫停';
}
function setLog(on){
  LOG.open = on; $('#log').hidden = !on;
  document.body.classList.toggle('log-open', on); uiBlockStale(); dirty = true;
  $('#btn-log').setAttribute('aria-pressed', String(on));
  if (on){
    if (isMobile()){ setHudOpen(false); if (state.cardOpen) clearSelection(); if (state.sideOpen) setSide(false, false); }
    updateLogLive(); renderLog();
  }
}

/* =====================================================================
 * 14. 加分：遠景（盆地地形、背景樹、三圈遠山剪影、漂移的雲、燈塔小島、帆船）
 *    全部不投影；手機版地形細分與背景樹減量
 * ===================================================================== */
const SCENERY = { clouds: null, cloudData: [], cloudMat: null, boats: null, boatData: [], t: 0 };
function buildScenery(){
  const mobile = isMobile();
  const noise = new SimplexNoise({ random: rngFor('terrain') });       // SimplexNoise 也用固定種子
  const fbm = (x, z, f0 = 0.035) => { let a = 0, amp = 1, f = f0, sum = 0; for (let o = 0; o < 4; o++){ a += noise.noise(x * f, z * f) * amp; sum += amp; amp *= 0.5; f *= 2.03; } return a / sum; };
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const fx = OV_DIR.x, fz = OV_DIR.z, fl = Math.hypot(fx, fz);
  const front = (x, z) => sstep(0.15, 0.9, (x * fx + z * fz) / ((Math.hypot(x, z) || 1) * fl));   // 越靠鏡頭這一側越接近 1
  const terrainH = (x, z) => {                                          // x、z 是相對城市中心的座標
    const r = Math.hypot(x, z), fr = front(x, z), shoreR = 15 + 14 * fr;
    let h = -2.4 + 3 * sstep(shoreR, shoreR + 8, r);
    h += sstep(25, 50, r) * (7 + fbm(x, z) * 6 + fbm(x + 40, z - 17, 0.08) * 2.5) * (1 - 0.82 * fr);   // 半徑 25–50 的環狀山，鏡頭側壓低
    if (h > 0.25 && h < 6){ const q = Math.floor(h / 0.5) * 0.5; h += (q - h) * 0.7; }                 // 梯田量化
    return h + fbm(x, z, 0.3) * 0.18 * sstep(shoreR, shoreR + 6, r);
  };
  /* 盆地地形：頂點色 河床 → 沙 → 田 → 草 → 林 → 岩，flatShading */
  const seg = mobile ? 110 : 160;
  const g = new THREE.PlaneGeometry(170, 170, seg, seg).rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  const stops = [[-0.6, '#8fb3ad'], [0.15, '#d9c9a3'], [0.7, '#aec493'], [2.0, '#a3b986'], [4.5, '#6f8a62'], [8.5, '#b2a38d']].map(([h, hex]) => [h, new THREE.Color(hex)]);
  for (let i = 0; i < pos.count; i++){
    const h = terrainH(pos.getX(i), pos.getZ(i)); pos.setY(i, h);
    let k = 0; while (k < stops.length - 2 && stops[k + 1][0] < h) k++;
    c.copy(stops[k][1]).lerp(stops[k + 1][1], clamp((h - stops[k][0]) / (stops[k + 1][0] - stops[k][0]), 0, 1));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const terrain = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  terrain.position.set(CITY.x, 0, CITY.z);
  scene.add(terrain);

  /* 背景樹：針葉（3 個 cone 合併）、闊葉（4 顆抖動 ico 合併），InstancedMesh、不投影，半徑 16–52 */
  const rr = rngFor('bg-trees'), target = mobile ? 220 : 600, spots = [];
  for (let n = 0; n < target * 8 && spots.length < target; n++){
    const a = rr() * Math.PI * 2, r = 16 + rr() * 36, x = Math.cos(a) * r, z = Math.sin(a) * r, h = terrainH(x, z);
    if (h < 0.45 || h > 9) continue;
    if (Math.abs(terrainH(x + 0.6, z) - h) + Math.abs(terrainH(x, z + 0.6) - h) > 1.1) continue;   // 太陡不種
    spots.push({ x, z, h, s: 0.55 + rr() * 0.6, conifer: h > 3.2 ? rr() < 0.75 : rr() < 0.3 });
  }
  const tint = (geo, rgb) => { const n = geo.attributes.position.count; geo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(n * 3).map((_, j) => rgb[j % 3]), 3)); return geo; };
  const trunk = [0.42, 0.32, 0.24], leaf = [1, 1, 1];
  const conGeo = BGU.mergeGeometries([
    tint(new THREE.CylinderGeometry(0.07, 0.09, 0.35, 5).translate(0, 0.17, 0), trunk),
    tint(new THREE.ConeGeometry(0.5, 0.7, 7).translate(0, 0.62, 0), leaf),
    tint(new THREE.ConeGeometry(0.4, 0.6, 7).translate(0, 0.98, 0), leaf),
    tint(new THREE.ConeGeometry(0.28, 0.5, 7).translate(0, 1.3, 0), leaf),
  ]);
  const brGeo = BGU.mergeGeometries([
    tint(new THREE.CylinderGeometry(0.07, 0.09, 0.45, 5).translate(0, 0.22, 0).toNonIndexed(), trunk),
    ...[[0, 0.75, 0, 0.42], [0.22, 0.62, 0.1, 0.32], [-0.2, 0.64, -0.08, 0.33], [0.04, 0.98, -0.04, 0.3]]
      .map(([x, y, z, s]) => tint(new THREE.IcosahedronGeometry(s, 0).translate(x, y, z), leaf)),
  ]);
  const treeMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 });
  const leafCols = ['#6f8a62', '#728f5f', '#8db86f', '#5f7a55', '#9cc27a', '#7e9a63'].map(h => new THREE.Color(h));
  for (const conifer of [true, false]){
    const list = spots.filter(s => s.conifer === conifer);
    if (!list.length) continue;
    const m = new THREE.InstancedMesh(conifer ? conGeo : brGeo, treeMat, list.length);
    list.forEach((s, i) => {
      m.setMatrixAt(i, M(CITY.x + s.x, s.h - 0.05, CITY.z + s.z, s.s, s.s * (0.9 + rr() * 0.3), s.s, rr() * 6.28));
      m.setColorAt(i, leafCols[Math.floor(rr() * leafCols.length)]);
    });
    m.castShadow = false; m.receiveShadow = false;
    scene.add(m);
  }

  /* 三圈遠山剪影：越遠越淡，霧會再把它們融進地平線 */
  [[78, '#93a9a6'], [96, '#a9bbb6'], [116, '#c3cfc8']].forEach(([rad, hex], k) => {
    const N = 160, v = [], idx = [];
    for (let i = 0; i <= N; i++){
      const a = i / N * Math.PI * 2, x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      const h = (2.2 + k * 1.2 + fbm(Math.cos(a) * 30 + k * 50, Math.sin(a) * 30, 0.06) * (2.5 + k)) * (1 - 0.85 * front(x, z));
      v.push(x, -1, z, x, Math.max(0.2, h), z);
      if (i < N){ const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
    }
    const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); sg.setIndex(idx);
    const ring = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: hex, side: THREE.DoubleSide }));
    ring.position.set(CITY.x, 0, CITY.z);
    scene.add(ring);
  });

  /* 12 團漂移的雲：放在城市後方高處，不擋住看城市的視線 */
  const cloudGeo = BGU.mergeGeometries([[0, 0, 0, 1], [0.95, -0.12, 0.2, 0.72], [-0.9, -0.15, -0.1, 0.7], [0.35, 0.38, -0.25, 0.62], [-0.3, 0.32, 0.3, 0.58]]
    .map(([x, y, z, s]) => new THREE.IcosahedronGeometry(s, 1).translate(x, y, z)));
  SCENERY.cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.18 });
  SCENERY.clouds = new THREE.InstancedMesh(cloudGeo, SCENERY.cloudMat, 12);
  SCENERY.clouds.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  SCENERY.clouds.frustumCulled = false;
  const cr = rngFor('clouds');
  for (let i = 0; i < 12; i++) SCENERY.cloudData.push({ x: -58 + cr() * 116, z: -(17 + cr() * 32), y: 6 + cr() * 3.5, s: 1 + cr() * 1.5, v: 0.25 + cr() * 0.35 });
  scene.add(SCENERY.clouds);

  /* 燈塔小島：城市左側的海面上 */
  const lk = new Kit('lighthouse'), la = Math.atan2(fz, fx) + 1.75;
  const lx = CITY.x + Math.cos(la) * 13.4, lz = CITY.z + Math.sin(la) * 13.4;
  lk.add('ico', M(lx, -0.95, lz, 2.6, 1.3, 2.3), PAL.stone);
  lk.add('cylinder', M(lx + 0.15, -0.1, lz + 0.1, 2.1, 0.32, 1.9), '#e3d3b0');
  [[0.22, 0.55, 0.62, PAL.cream], [0.77, 0.38, 0.56, PAL.coral], [1.15, 0.45, 0.5, PAL.cream], [1.6, 0.3, 0.46, PAL.coral]]
    .forEach(([y, h, w, cc]) => lk.add('cylinder', M(lx, y, lz, w, h, w), cc));
  lk.add('cylinder', M(lx, 1.9, lz, 0.62, 0.06, 0.62), PAL.ink);
  lk.add('glowsphere', M(lx, 1.94, lz, 0.38, 0.38, 0.38), PAL.yellow);
  lk.add('cone', M(lx, 2.3, lz, 0.5, 0.36, 0.5), PAL.coral);
  lk.add('rbox', M(lx + 0.75, 0.22, lz + 0.35, 0.55, 0.4, 0.5, 0.4), PAL.wall);
  lk.add('hip', M(lx + 0.75, 0.62, lz + 0.35, 0.6, 0.32, 0.55, 0.4), PAL.coral);
  lk.add('pool', M(lx, 0.24, lz, 2.2, 1, 2.2), '#ffffff');
  lk.build(scene);

  /* 帆船：在城市與岸邊之間的水道上緩緩來回 */
  const noUv = geo => { geo.deleteAttribute('uv'); return geo; };       // 三角柱沒有 uv，合併前統一拿掉
  const boatGeo = BGU.mergeGeometries([
    tint(noUv(new THREE.BoxGeometry(0.9, 0.18, 0.32).translate(0, 0.05, 0).toNonIndexed()), [0.71, 0.52, 0.38]),
    tint(noUv(new THREE.BoxGeometry(0.7, 0.04, 0.26).translate(0, 0.16, 0).toNonIndexed()), [0.92, 0.85, 0.75]),
    tint(noUv(new THREE.CylinderGeometry(0.02, 0.02, 0.95, 5).translate(0.05, 0.62, 0).toNonIndexed()), [0.25, 0.22, 0.22]),
    tint(noUv(GEO.prism.clone().scale(0.55, 0.78, 0.02).translate(-0.2, 0.2, 0)), [1, 0.97, 0.94]),
    tint(noUv(GEO.prism.clone().scale(0.32, 0.55, 0.02).translate(0.26, 0.2, 0.01)), [0.86, 0.42, 0.25]),
  ]);
  SCENERY.boats = new THREE.InstancedMesh(boatGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8 }), 3);
  SCENERY.boats.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  SCENERY.boats.frustumCulled = false;
  const base = Math.atan2(fz, fx);
  SCENERY.boatData = [[base - 1.7, 13.2, 0.22], [base - 2.7, 12.9, 0.18], [base + 2.55, 13.3, 0.2]].map(([a, r, amp], i) => ({ a, r, amp, ph: i * 2.1, sp: 0.09 + i * 0.02, h: null }));
  scene.add(SCENERY.boats);
  updateScenery(0);
}
function updateScenery(dt){
  if (!SCENERY.clouds) return;
  SCENERY.t += dt;
  SCENERY.cloudData.forEach((d, i) => {
    d.x += d.v * dt; if (d.x > 60) d.x = -60;
    SCENERY.clouds.setMatrixAt(i, M(CITY.x + d.x, d.y, CITY.z + d.z, d.s, d.s * 0.6, d.s));
  });
  SCENERY.clouds.instanceMatrix.needsUpdate = true;
  SCENERY.boatData.forEach((b, i) => {
    const u = SCENERY.t * b.sp + b.ph, a = b.a + Math.sin(u) * b.amp, va = Math.cos(u) * b.amp * b.sp;
    const x = CITY.x + Math.cos(a) * b.r, z = CITY.z + Math.sin(a) * b.r;
    const vx = -Math.sin(a) * va, vz = Math.cos(a) * va;              // 沿圓弧切線前進，船頭（+x）朝行進方向
    if (Math.hypot(vx, vz) > 1e-5){
      const goal = Math.atan2(-vz, vx);
      if (b.h === null || dt === 0) b.h = b.h === null ? goal : b.h;
      b.h += Math.atan2(Math.sin(goal - b.h), Math.cos(goal - b.h)) * Math.min(1, dt * 0.8);   // 折返時慢慢掉頭
    }
    SCENERY.boats.setMatrixAt(i, M(x, WATER_Y - 0.02 + Math.sin(SCENERY.t * 1.6 + i) * 0.025, z, 1, 1, 1, b.h || 0, 0, Math.sin(SCENERY.t * 1.3 + i) * 0.05));
  });
  SCENERY.boats.instanceMatrix.needsUpdate = true;
}

/* =====================================================================
 * 11. 尺寸變化、主迴圈（只在有動畫或互動時 render）
 * ===================================================================== */
function onResize(){
  const w = glEl.clientWidth, h = glEl.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, mobileMQ.matches ? 1.4 : 1.75));
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (state.view === 'overview' && !fly.on){
    const o = overviewPose(); camera.position.copy(o.pos); controls.target.copy(o.target); controls.update();
  }
  if (state.map) measureLabels();
  if (cardEl && !isMobile()){ sheetReset(cardEl); sheetReset(sideEl); setHudOpen(false); }   // 從手機尺寸變回桌面：清掉拖曳過的高度
  uiBlockStale(); dirty = true;
}

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.08, Math.max(0, (now - last) / 1000)); last = now;
  let anim = false;
  if (updateClock(dt)){ applyDayCycle(clock.min); updateHud(); anim = true; }
  const live = clock.running && !reduced;                          // 暫停或「減少動態」時，小人與流動圖樣都停住
  if (live){ worldTime += dt; FLOW.clock += dt; FLOW.time.value += dt; updateWalkers(dt); updateScenery(dt); anim = true; }
  if (LOG.open && LOG.dirty && now - LOG.last > 600){ LOG.last = now; renderLog(); }   // 日誌最多每 0.6 秒更新一次
  if (updateFly(dt)) anim = true;
  if (updatePop(dt)) anim = true;
  if (controls.update()) anim = true;
  updateTour(dt);
  applyLOD();
  if (!anim && !dirty) return;
  if (!live) updateWalkers(0);                                     // 停住時鏡頭移動，小人的遠近縮放仍要更新
  FLOW.thick.value = clamp(camera.position.distanceTo(controls.target) / 9, 1, 3.2);
  const far = FLOW.thick.value > 2.2;                              // 鏡頭距離 > 19.8 算遠看
  if (far !== FLOW.far){ FLOW.far = far; applyFlowOnTop(); }
  U.water.uTime.value = worldTime; U.body.uTime.value = worldTime;
  sky.position.copy(camera.position);
  updateTags();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  layoutLabels();
  dirty = false;
}

function start(){
  initRenderer();
  initLayout();
  initDayCycle();
  initTextures();
  initKit();
  initEnvironment();
  initIslands();
  buildNetwork();
  buildStatic();
  const t0 = performance.now();
  try { buildScenery(); } catch (err){ console.warn('遠景建立失敗，略過（不影響主要功能）', err); }   // 加分項目出錯不拖垮核心
  SCENERY.ms = Math.round(performance.now() - t0);
  itemRoot.group = new THREE.Group(); scene.add(itemRoot.group);
  FLOW.group = new THREE.Group(); scene.add(FLOW.group);
  FLOW.ring = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.14, 28).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: PAL.coral, transparent: true, opacity: 0.95, depthWrite: false, toneMapped: false }));
  FLOW.ring.visible = false; FLOW.ring.renderOrder = 6; scene.add(FLOW.ring);       // 被點到的小人腳下的珊瑚色圈
  initLabels();
  initTags();
  initUI();
  /* prefers-reduced-motion：即時切換。改成減少動態時，飛行與長出動畫直接跳到結果 */
  reduceMQ.addEventListener('change', e => {
    reduced = e.matches;
    if (reduced){
      if (fly.on){ camera.position.copy(fly.p1); controls.target.copy(fly.t1); fly.on = false; controls.update(); }
      if (pop.t < 1){ pop.t = 1; applyPop(1); }
    }
    updateLogLive(); dirty = true;
  });
  onResize();
  new ResizeObserver(onResize).observe(glEl);
  const o = overviewPose(); camera.position.copy(o.pos); controls.target.copy(o.target); controls.update();
  const firstMap = DATA.maps[QS.get('map')] ? QS.get('map') : DATA.meta.defaultMap;
  applyMap(firstMap, { flyHome: false });
  applyDayCycle(clock.min);
  if (QS.has('net')) drawNetwork();
  if (QS.has('debug')) window.__dbg = { THREE, renderer, scene, camera, controls, state, clock, NET, ISL, labels, pins, tour, itemRoot, lod, MAT, FLOW, TAGS, LOG, SCENERY, BADGE, dijkstra,
    get reduced(){ return reduced; },
    flyToIsland, flyTo, applyMap, setTime, selectIsland, selectItem, selectFlow, selectWalker, clearSelection, setPresent, setBird, setSide, setShowFlows,
    get staticCounts(){ return { big: staticBuilt.meshes.length, small: staticSmall.meshes.length }; } };
  requestAnimationFrame(t => {
    last = t; loop(t);
    requestAnimationFrame(() => {
      $('#loader').classList.add('done'); booted = true;
      if (!store.get('ali-guide-seen') && !QS.has('noguide')) openGuide(false);   // 第一次進入：3 步驟操作說明
    });
  });
}
</script>
